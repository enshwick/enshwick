# release-plz: versions from conventional commits and cargo-semver-checks,
# changelogs, tags `<package>-v<version>`. Runs through the release-plz
# workflow, by hand or on each merge to main once RELEASE_ON_MERGE is on; the
# alpha releases of the loader come from alpha.yml.

[workspace]
# `release` acts only when the newest commit on main is a merged release pull
# request, so a stray run publishes nothing.
release_always = false
# A version with a prerelease part (`1.0.0-alpha.3`) makes a GitHub prerelease.
git_release_type = "auto"
# A release's notes are its changelog section; a version without change files
# of its own says so instead of an empty body.
git_release_body = """
{% if changelog | trim %}{{ changelog }}{% else %}This version lists no changes of its own. The changelog of `enshwick` lists what mod authors see.{% endif %}
"""
# Only our own crates move in a release pull request; Renovate moves the rest.
dependencies_update = false
pr_labels = ["release"]
# The pull request body follows the repository's form: outcome bullets; each
# package's CHANGELOG.md in the pull request holds the details.
pr_body = """
## Chores

{% for release in releases -%}
- Released `{{ release.package }}` {{ release.next_version }}{% if release.previous_version and release.previous_version != release.next_version %} (was {{ release.previous_version }}){% endif %}{% if release.semver_check == "incompatible" %}, with breaking API changes{% endif %}.
{% endfor %}
Each package's `CHANGELOG.md` in this pull request lists what changed.
"""

# A package's changelog is its change files, joined by `cargo xtask close` in
# the release pull request after release-plz writes it: release-plz adds only
# the version's heading, never entries of its own from the commits, and
# `release` takes the joined section as the GitHub release's notes. Every
# package it releases keeps a CHANGELOG.md, since without one the release
# carries no notes; `cargo xtask check` refuses a package that lacks it or
# turns its changelog off.
[changelog]
body = """
## [{{ version }}] - {{ timestamp | date(format="%Y-%m-%d") }}
"""

# The API crate and its internal parts release at one version, which the
# ABI's messages name from `enshwick-abi` as the API crate's.
[[package]]
name = "enshwick"
version_group = "api"

[[package]]
name = "enshwick-macros"
version_group = "api"

[[package]]
name = "enshwick-values"
version_group = "api"

[[package]]
name = "enshwick-abi"
version_group = "api"

[[package]]
name = "enshwick-base"
version_group = "api"

[[package]]
name = "enshwick-content"
version_group = "api"

[[package]]
name = "enshwick-world"
version_group = "api"

[[package]]
name = "enshwick-inventory"
version_group = "api"

[[package]]
name = "enshwick-knowledge"
version_group = "api"

[[package]]
name = "enshwick-actions"
version_group = "api"

[[package]]
name = "enshwick-ui"
version_group = "api"

[[package]]
name = "enshwick-packs"
version_group = "api"

[[package]]
name = "enshwick-typed"
version_group = "api"

[[package]]
name = "enshwick-core"
version_group = "api"

[[package]]
name = "enshwick-fake"
version_group = "api"

# The loader DLL and the proxy stub are not published to crates.io: their
# versions live in git tags.
[[package]]
name = "enshwick-loader"
git_only = true
publish = false

[[package]]
name = "enshwick-loader-stub"
git_only = true
publish = false

# The start contract, built into the loader and the stub, examples and
# tools never release.
[[package]]
name = "enshwick-loader-start"
release = false

[[package]]
name = "enshwick-example-haggling"
release = false

[[package]]
name = "enshwick-example-trading-post"
release = false

[[package]]
name = "xtask"
release = false
