# release-plz: versions from conventional commits and cargo-semver-checks,
# changelogs, tags `<package>-v<version>` and crates.io. Runs through the
# release-plz workflow, by hand or on each merge to main once
# RELEASE_ON_MERGE is on. It makes no GitHub release: the release workflow
# (release.yml) makes the one release of each version, `v<version>`, with
# `enshwick.zip`, `cargo-enshwick` and the notes of every crate; the
# release-plz workflow calls it when the loader releases, and an alpha runs
# it by hand.

[workspace]
# `release` acts only when the newest commit on main is a merged release pull
# request, so a stray run publishes nothing.
release_always = false
# One release per version, the release workflow's: a release per crate
# would bury the loader's among some twenty, and the update check reads the
# newest twenty releases.
git_release_enable = false
# Only our own crates move in a release pull request; Renovate moves the rest.
dependencies_update = false
pr_labels = ["release"]
# The pull request body follows the repository's form: outcome bullets; each
# package's CHANGELOG.md in the pull request holds the details.
pr_body = """
## Chores

{% for release in releases -%}
- Released `{{ release.package }}` {{ release.next_version }}{% if release.previous_version and release.previous_version != release.next_version %} (was {{ release.previous_version }}){% endif %}{% if release.semver_check == "incompatible" %}, with breaking API changes{% endif %}.
{% endfor %}
Each package's `CHANGELOG.md` in this pull request lists what changed.
"""

# A package's changelog is its change files, joined by `cargo xtask close` in
# the release pull request after release-plz writes it: release-plz adds only
# the version's heading, never entries of its own from the commits, and
# `cargo xtask notes` joins every package's section into the release's
# notes. Every package it releases keeps a CHANGELOG.md; `cargo xtask check`
# refuses a package that lacks it, turns its changelog off or gets a GitHub
# release of its own.
[changelog]
body = """
## [{{ version }}] - {{ timestamp | date(format="%Y-%m-%d") }}
"""

# The API crate and its internal parts release at one version, which the
# ABI's messages name from `enshwick-abi` as the API crate's.
[[package]]
name = "enshwick"
version_group = "api"

[[package]]
name = "enshwick-macros"
version_group = "api"

[[package]]
name = "enshwick-values"
version_group = "api"

[[package]]
name = "enshwick-abi"
version_group = "api"

[[package]]
name = "enshwick-base"
version_group = "api"

[[package]]
name = "enshwick-content"
version_group = "api"

[[package]]
name = "enshwick-world"
version_group = "api"

[[package]]
name = "enshwick-inventory"
version_group = "api"

[[package]]
name = "enshwick-knowledge"
version_group = "api"

[[package]]
name = "enshwick-actions"
version_group = "api"

[[package]]
name = "enshwick-ui"
version_group = "api"

[[package]]
name = "enshwick-packs"
version_group = "api"

[[package]]
name = "enshwick-typed"
version_group = "api"

[[package]]
name = "enshwick-core"
version_group = "api"

[[package]]
name = "enshwick-fake"
version_group = "api"

# The loader, the stub and `cargo enshwick` ship in one GitHub release,
# `v<version>`: `enshwick.zip` holds the loader and the stub, and the tool
# installs the loader of its own version and binstalls from that tag. The
# loader's tag is that release's, which alphas carry too and the mods'
# release tooling reads. The loader and the stub are not published to
# crates.io: their versions live in git tags.
[[package]]
name = "enshwick-loader"
version_group = "release"
git_only = true
publish = false
git_tag_name = "v{{ version }}"

[[package]]
name = "enshwick-loader-stub"
version_group = "release"
git_only = true
publish = false

[[package]]
name = "cargo-enshwick"
version_group = "release"

# The start contract, built into the loader and the stub, examples and
# tools never release.
[[package]]
name = "enshwick-loader-start"
release = false

[[package]]
name = "enshwick-example-haggling"
release = false

[[package]]
name = "enshwick-example-trading-post"
release = false

[[package]]
name = "xtask"
release = false
