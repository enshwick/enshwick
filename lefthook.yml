pre-commit:
  parallel: true
  commands:
    rustfmt:
      glob:
        - '*.rs'
        - '**/*.rs'
      run: cargo fmt --all --check && cargo fmt --manifest-path fuzz/Cargo.toml --all --check
    markdown:
      glob: '*.md'
      exclude:
        - '**/CHANGELOG.md'
      run: rumdl check {staged_files}
    typos:
      run: typos --force-exclude {staged_files}
    # zizmor offline: its online audits need a GitHub token and the network.
    workflows:
      glob: '.github/**'
      run: actionlint && zizmor --offline --quiet .

# Nothing that compiles: the hook stays under ten seconds. The compiling
# checks are `cargo xtask check` (what the branch touches) and
# `cargo xtask check --all` (everything); they gate merges.
pre-push:
  parallel: true
  commands:
    rustfmt:
      glob:
        - '*.rs'
        - '**/*.rs'
      run: cargo fmt --all --check && cargo fmt --manifest-path fuzz/Cargo.toml --all --check
    markdown:
      glob: '*.md'
      exclude:
        - '**/CHANGELOG.md'
      run: rumdl check {push_files}
    typos:
      run: typos --force-exclude {push_files}
    deny:
      glob:
        - 'Cargo.toml'
        - '**/Cargo.toml'
        - 'Cargo.lock'
        - 'deny.toml'
      # Advisories need the network and change without any commit: CI's
      # full suite checks them every night.
      run: cargo deny check bans licenses sources
    workflows:
      glob: '.github/**'
      run: actionlint && zizmor --offline --quiet .
