pre-commit:
  parallel: true
  commands:
    rustfmt:
      glob:
        - '*.rs'
        - '**/*.rs'
      run: cargo fmt --all --check
    markdown:
      glob: '*.md'
      exclude:
        - '**/CHANGELOG.md'
      run: bunx markdownlint-cli2 --no-globs {staged_files}
    typos:
      run: typos --force-exclude {staged_files}

commit-msg:
  commands:
    conventional:
      run: bun tools/check-commit-message.ts {1}

# Only what the pushed change needs (tools/xtask): tests of the changed
# packages and their dependents, clippy and doctests where something changed.
# The full suite is `cargo xtask check --all`.
pre-push:
  parallel: true
  commands:
    checks:
      glob:
        - '*.rs'
        - '**/*.rs'
        - 'Cargo.toml'
        - '**/Cargo.toml'
        - 'Cargo.lock'
        - 'rust-toolchain.toml'
        - 'clippy.toml'
        - '.cargo/*'
        - '.config/*'
        - 'book/src/*.md'
        - 'book/src/**/*.md'
      run: cargo xtask check
    deny:
      glob:
        - 'Cargo.toml'
        - '**/Cargo.toml'
        - 'Cargo.lock'
        - 'deny.toml'
      run: cargo deny check
