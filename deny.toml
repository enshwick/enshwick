[graph]
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu"]

[advisories]
yanked = "deny"
unmaintained = "workspace"

[licenses]
allow = ["MIT", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "Unicode-3.0"]
confidence-threshold = 0.9
# Each exception with its reason.
exceptions = [
    # Mozilla's root certificates, which the updater's TLS checks GitHub
    # against; CDLA-Permissive-2.0 only asks to keep the license text.
    { allow = ["CDLA-Permissive-2.0"], crate = "webpki-roots" },
]

[bans]
multiple-versions = "deny"
# Duplicates allowed on purpose, each with its reason.
skip = [
    { crate = "getrandom@0.2", reason = "ring under the updater's rustls; leaves with the updater" },
]
allow-wildcard-paths = true
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
