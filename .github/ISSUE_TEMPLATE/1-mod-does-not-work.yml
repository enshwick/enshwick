name: A mod does not work
description: A mod or the loader does something wrong, or nothing at all.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Questions go to [Discussions](https://github.com/enshwick/.github/discussions).
        The logs are in `logs/` in the game's folder, beside `enshrouded.exe` or `enshrouded_server.exe`.
        When the loader did not start, there is no loader's log, only `logs/start.log`. When the game's folder takes no files, that file is `enshwick/start.log` in the Windows temporary folder (`%TEMP%`).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you saw, and what you expected instead.
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - Single player
        - Hosting a game for friends
        - Joining a game a friend hosts
        - Joining a dedicated server
        - On the dedicated server itself
    validations:
      required: true
  - type: input
    id: game
    attributes:
      label: Game version
      description: "The `game:` line of the loader's log, `logs/enshwick_<date>_<time>.log`, names it. For a build the loader does not know, copy its `unknown game build` line instead. Without a loader's log, write `no loader's log`."
    validations:
      required: true
  - type: input
    id: loader
    attributes:
      label: Loader version
      description: The first line of the loader's log names it. Without a loader's log, give the release you installed.
    validations:
      required: true
  - type: textarea
    id: mods
    attributes:
      label: Mods
      description: Only when the loader's log cannot be attached; every folder in the game's `mods` folder.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Drag the loader's log of the run that went wrong here, `logs/enshwick_<date>_<time>.log`. Add the log of the mod that went wrong, `logs/<mod id>_<date>_<time>.log`, and after a crash `logs/enshwick-crash_<date>_<time>.log`. When the loader did not start, attach `start.log` instead. Paths in the logs show your folders, so read them before you share them.
    validations:
      required: true
