name: A mod does not work
description: A mod or the loader does something wrong, or nothing at all.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Questions go to [Discussions](https://github.com/enshwick/.github/discussions).
        The logs are in `logs/` in the game's folder, beside `enshrouded.exe` or `enshrouded_server.exe`.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you saw, and what you expected instead.
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - Single player
        - Hosting a game for friends
        - Joining a game a friend hosts
        - Joining a dedicated server
        - On the dedicated server itself
    validations:
      required: true
  - type: input
    id: game
    attributes:
      label: Game version
      description: "The `game:` line of the loader's log, `logs/enshwick_<date>_<time>.log`, names it."
    validations:
      required: true
  - type: input
    id: loader
    attributes:
      label: Loader version
      description: The loader's log names it.
    validations:
      required: true
  - type: textarea
    id: mods
    attributes:
      label: Mods
      description: Only when the loader's log cannot be attached; every folder in the game's `mods` folder.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Drag the loader's log of the run that went wrong here, `logs/enshwick_<date>_<time>.log`, and after a crash `logs/enshwick-crash_<date>_<time>.log` too. Paths in the log show your folders, so read it before you share it.
    validations:
      required: true
