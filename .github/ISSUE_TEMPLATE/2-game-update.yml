name: A game update broke something
description: A mod or the loader stopped working after Enshrouded updated.
labels: [bug, game-update]
body:
  - type: markdown
    attributes:
      value: |
        After an update the loader keeps running and turns off what it cannot find in the new build. `logs/enshwick/status.log` lists what is off.
  - type: textarea
    id: what
    attributes:
      label: What stopped working
    validations:
      required: true
  - type: input
    id: game
    attributes:
      label: Game version
      description: "`logs/enshwick/report.md` names it, beside the loader version."
    validations:
      required: true
  - type: dropdown
    id: side
    attributes:
      label: Which game
      options:
        - The game client
        - The dedicated server
        - Both
    validations:
      required: true
  - type: input
    id: loader
    attributes:
      label: Loader version
      description: "Named at the top of `logs/enshwick/report.md`."
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Report
      description: Drag `report.md` from `logs/enshwick/` here.
    validations:
      required: true
