name: A game update broke something
description: A mod or the loader stopped working after Enshrouded updated.
labels: [bug, game-update]
body:
  - type: markdown
    attributes:
      value: |
        After an update the loader keeps running and turns off what it cannot find in the new build. The loader's log in `logs/` names each feature that is off, and the game client's Mods screen lists them; a dedicated server has only the log.
        The log lists each missing entry only at the `debug` level. To add that list, set `log_level = "debug"` in `enshwick.toml` in the game's folder and start the game again.
        When the loader did not start, there is no loader's log, only `logs/start.log`. When the game's folder takes no files, that file is `enshwick/start.log` in the Windows temporary folder (`%TEMP%`).
  - type: textarea
    id: what
    attributes:
      label: What stopped working
    validations:
      required: true
  - type: input
    id: game
    attributes:
      label: Game version
      description: "The `game:` line of the loader's log, `logs/enshwick_<date>_<time>.log`, names it. For a build the loader does not know, copy its `unknown game build` line instead. Without a loader's log, write `no loader's log`."
    validations:
      required: true
  - type: dropdown
    id: side
    attributes:
      label: Which game
      options:
        - The game client
        - The dedicated server
        - Both
    validations:
      required: true
  - type: input
    id: loader
    attributes:
      label: Loader version
      description: The first line of the loader's log names it. Without a loader's log, give the release you installed.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Drag the loader's log of the run after the update here, `logs/enshwick_<date>_<time>.log`. After a crash, add `logs/enshwick-crash_<date>_<time>.log`. When the loader did not start, attach `start.log` instead. Paths in the logs show your folders, so read them before you share them.
    validations:
      required: true
