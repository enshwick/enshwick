# Publishes the platform's crates to crates.io, run by hand: each in turn,
# after the ones it depends on, and only a version crates.io does not have.
# While the CRATES_IO_TOKEN secret exists the run publishes with it; once
# crates.io lists this file as each crate's trusted publisher and the secret
# is gone, it publishes through trusted publishing.
name: publish

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    # Crates are published only from main.
    if: github.ref == 'refs/heads/main'
    # The release environment admits main only.
    environment: release
    # A fresh machine: what ships is built and published without the
    # caches that branch builds write to.
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: read
      # crates.io trusted publishing.
      id-token: write
    env:
      HAS_TOKEN: ${{ secrets.CRATES_IO_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The C toolchain the build scripts link with comes with setup-rust.
      - uses: ./.github/actions/setup-rust

      - name: Trusted publishing
        id: auth
        if: env.HAS_TOKEN != 'true'
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN || steps.auth.outputs.token }}
        run: |
          # The sparse index path of a crate name: 1/, 2/, 3/<first>/ or
          # <first two>/<next two>/, lower case.
          index_path() {
            local name=${1,,}
            case ${#name} in
              1) echo "1/$name" ;;
              2) echo "2/$name" ;;
              3) echo "3/${name:0:1}/$name" ;;
              *) echo "${name:0:2}/${name:2:2}/$name" ;;
            esac
          }
          # Every member that may publish; cargo publishes the selection each
          # after the ones it depends on. Plain assignments, so -e stops the
          # step when cargo or jq fails.
          metadata=$(cargo metadata --locked --no-deps --format-version 1)
          members=$(jq -r '.packages[] | select(.publish != []) | "\(.name) \(.version)"' <<< "$metadata")
          if [ -z "$members" ]; then
            echo "cargo metadata names no crate to publish" >&2
            exit 1
          fi
          selected=()
          while read -r package version; do
            if curl -fsS "https://index.crates.io/$(index_path "$package")" 2>/dev/null |
              grep -qF "\"vers\":\"$version\""; then
              echo "$package $version is on crates.io already"
              continue
            fi
            selected+=(-p "$package")
          done <<< "$members"
          if [ ${#selected[@]} -eq 0 ]; then
            echo "Every crate is on crates.io already"
            exit 0
          fi
          cargo publish --locked "${selected[@]}"
