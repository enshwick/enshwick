name: Rust CI part

# One part of rust-ci.yml's check on its own runner: `cargo xtask check
# --part <part>`, or the whole check for `all`. rust-ci.yml calls it for the
# parts every change runs and, once the listing is done, for the ones only
# some changes need.

on:
  workflow_call:
    inputs:
      part:
        description: The xtask part, or `all` for the whole check.
        type: string
        required: true
      base:
        description: The commit or branch the change is checked against.
        type: string
        required: true
      full:
        description: Run the full suite instead of the packages a change touches.
        type: boolean
        default: false
      semver:
        description: Packages checked with cargo-semver-checks, space-separated.
        type: string
        default: ""
      deny:
        description: Run cargo-deny's bans, licenses and sources before the host check.
        type: boolean
        default: false

permissions: {}

env:
  # Only pushes to main store build caches. The repository's cache storage
  # is full, and entries of pull requests and merge queue groups, which no
  # other run restores, would evict the ones every run starts from.
  STORE_CACHES: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

jobs:
  part:
    name: xtask
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      BASE: ${{ inputs.base }}
      FULL: ${{ inputs.full }}
      PART: ${{ inputs.part }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch the base
        run: git cat-file -e "$BASE^{commit}" 2> /dev/null || git fetch -q origin "$BASE"

      # The mods the book links files of, for the book link check; ignored
      # by git, so no workspace member, tool or scan of this tree takes it.
      # Only the host part runs that check.
      - if: inputs.part == 'host' || inputs.part == 'all'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: enshwick/mods
          path: .mods
          fetch-depth: 1
          persist-credentials: false

      # Nothing persists between jobs: the toolchain, the Windows SDK and the
      # apt packages come from the cache.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.tool_cache }}/rustup
          # The fuzz part's also holds the nightly that setup-rust pins.
          key: rustup-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}${{ inputs.part == 'fuzz' && format('-fuzz-{0}', hashFiles('.github/actions/setup-rust/action.yml')) || '' }}
      # The Windows SDK and CRT cargo-xwin downloads, about 12 minutes from
      # Microsoft on a hosted runner. Only the cross-compiling parts here
      # (`windows-lint`, `windows-features` and `all`) use it; rust-ci.yml's
      # job `windows` builds natively.
      - if: inputs.part == 'windows-lint' || inputs.part == 'windows-features' || inputs.part == 'all'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.tool_cache }}/xwin
          key: xwin-${{ runner.os }}-0.24.1-v1
      # clang of the toolchain's LLVM; the docs, features, stable-api,
      # trybuild and semver parts install the host part's packages, the
      # windows-features part the windows-lint part's.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.tool_cache }}/apt-archives
          key: apt-${{ runner.os }}-${{ (inputs.part == 'docs' || inputs.part == 'features' || inputs.part == 'stable-api' || inputs.part == 'trybuild' || inputs.part == 'semver') && 'host' || inputs.part == 'windows-features' && 'windows-lint' || inputs.part }}-v2

      - uses: ./.github/actions/setup-rust
        with:
          tools: cargo-nextest@0.9.152,cargo-deny@0.22.0,cargo-machete@0.10.1${{ inputs.semver != '' && (inputs.part == 'semver' || inputs.part == 'all') && ',cargo-semver-checks@0.51.0' || '' }}
          ast-grep: ${{ inputs.part == 'host' || inputs.part == 'all' }}
          sanitizers: ${{ inputs.part == 'fuzz' }}
          fuzz: ${{ inputs.part == 'fuzz' }}

      - uses: ./.github/actions/sccache
        with:
          store: ${{ env.STORE_CACHES }}

      # The build itself, per part: each job builds a different target. The
      # windows-features part starts from the windows-lint part's and stores
      # none of its own, which would only evict others from the full store.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # A cache saved by a failed run would be restored as it is and
          # never replaced, so only a finished run saves one.
          prefix-key: v1-rust
          key: ${{ inputs.part == 'windows-features' && 'windows-lint' || inputs.part }}
          save-if: ${{ env.STORE_CACHES == 'true' && inputs.part != 'windows-features' }}

      # The luau-lsp the tests download, kept per pin instead of fetched by
      # each test process.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: inputs.part == 'host' || inputs.part == 'all'
        with:
          path: ~/.cache/enshwick
          key: luau-lsp-${{ runner.os }}-${{ hashFiles('crates/cargo-enshwick/luau-lsp.toml') }}

      # A change to a manifest, the lock file or the policy can bring in a
      # dependency the policy refuses; it needs no build, so it goes first.
      # Advisories change without any commit: the full suite checks them.
      - name: cargo deny
        if: inputs.deny && (inputs.part == 'host' || inputs.part == 'all')
        run: cargo deny check bans licenses sources

      - name: cargo xtask check
        env:
          ENSH_MODS_DIR: ${{ github.workspace }}/.mods
          SEMVER: ${{ inputs.semver }}
        run: |
          args=()
          if [ "$FULL" = true ]; then args+=(--all); else args+=(--base "$BASE"); fi
          if [ "$PART" != all ]; then args+=(--part "$PART"); fi
          for package in $SEMVER; do args+=(--semver "$package"); done
          if [ "$PART" = all ] || [ "$PART" = host ]; then cargo fmt --all --check; fi
          cargo xtask check "${args[@]}"

      - name: sccache statistics
        if: ${{ !cancelled() && env.RUSTC_WRAPPER == 'sccache' }}
        run: sccache --show-stats
