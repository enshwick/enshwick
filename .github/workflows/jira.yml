# Keeps the board in step with pull requests and a red main, as enshwick-ci.
name: jira

# Any pull request may name a ticket, so no path filter.
on:
  pull_request:
    types: [opened, reopened, ready_for_review, closed]
  # Every workflow that runs on a push to main: a failed run is a red main.
  # Coverage stays out: it only informs.
  # Runs the copy on main and reads nothing from the run it follows.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [ci, dev-build, docs]
    types: [completed]
    branches: [main]

permissions: {}

concurrency:
  group: jira-${{ github.event.pull_request.number || github.event.workflow_run.id }}-${{ github.event.pull_request.draft }} # a draft's late run never cancels a ready one
  cancel-in-progress: true

jobs:
  # A draft moves nothing; marking it ready moves its ticket.
  move:
    if: >-
      (github.event_name == 'pull_request'
        && (github.event.pull_request.merged
          || (github.event.action != 'closed' && github.event.pull_request.draft != true)))
      || (github.event_name == 'workflow_run'
        && github.event.workflow_run.event == 'push'
        && contains(fromJSON('["failure","timed_out"]'), github.event.workflow_run.conclusion))
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      # A merge and a red main run main's script; an open pull request runs its
      # own, as it runs its own copy of this workflow.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && !github.event.pull_request.merged && github.event.pull_request.head.sha || github.event.repository.default_branch }}
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Move the tickets
        env:
          JIRA_PROJECT: WIK
          JIRA_SITE: ${{ secrets.ATLASSIAN_CI_SITE }}
          JIRA_EMAIL: ${{ secrets.ATLASSIAN_CI_EMAIL }}
          JIRA_TOKEN: ${{ secrets.ATLASSIAN_CI_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          ACTION: ${{ github.event.action }}
          MERGED: ${{ github.event.pull_request.merged }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_NAME: ${{ github.event.workflow_run.name }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: bash .github/scripts/jira.sh
