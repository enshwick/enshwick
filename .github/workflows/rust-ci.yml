name: Rust CI

# `cargo xtask check` for a pull request, a merge queue entry or a push to
# main, on GitHub-hosted runners, with the toolchain, the Windows SDK and the
# build cached between runs; a push to main runs the full suite and fills the
# caches pull requests start from. With `split` the host check, the doctests
# and rustdoc, the Windows lint, the API's trybuild test, its stable surface
# and cargo-semver-checks run as parallel jobs, the workspace's doctests and
# rustdoc only in the merge queue, on main and with `full`, and the trybuild
# test and the stable surface of a pull request only when its change needs
# them. The Windows tests run natively on a Windows runner. Each part runs
# through rust-ci-part.yml. Only the job `list` builds xtask, and only the
# jobs whose work it lists wait for it. The job `check` sums them up and is
# the required check.

on:
  workflow_call:
    inputs:
      full:
        description: Run the full suite instead of the packages a change touches.
        type: boolean
        default: false
      windows-tests:
        description: Run the Windows-only crates' tests natively on a GitHub-hosted Windows runner.
        type: boolean
        default: true
      split:
        description: Run the host check, the doctests and rustdoc, the Windows lint, the API's trybuild test, its stable surface and cargo-semver-checks as parallel jobs, and only the Windows tests, trybuild test and stable surface a change needs; the repository's `cargo xtask` must know `check --part` with the parts `stable-api`, `trybuild` and `semver`, `check --semver` and `check --list` with `windows-tests` and `parts`.
        type: boolean
        default: false
      semver:
        description: Packages checked with cargo-semver-checks against their last release on crates.io, space-separated; none when empty.
        type: string
        default: ""

permissions: {}

env:
  # Only pushes to main store build caches. The repository's cache storage
  # is full, and entries of pull requests and merge queue groups, which no
  # other run restores, would evict the ones every run starts from.
  STORE_CACHES: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

jobs:
  scope:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      # A merge queue entry is checked against the entry before it (its
      # group's parent): only its own pull request's changes are new.
      BASE: ${{ github.event.merge_group.base_sha || format('origin/{0}', github.base_ref || github.event.repository.default_branch) }}
      FULL: ${{ inputs.full || (github.event_name != 'pull_request' && github.event_name != 'merge_group') }}
    outputs:
      skip: ${{ steps.scope.outputs.skip }}
      proven: ${{ steps.scope.outputs.proven }}
      deny: ${{ steps.scope.outputs.deny }}
      branch: ${{ steps.scope.outputs.branch }}
      parts: ${{ steps.parts.outputs.parts }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Work already proven is not repeated: a merge queue group whose tree
      # is its pull request's own head passed that pull request's check
      # (split, all but the docs part), and a change to files that never
      # build (documents outside the book, repository settings, other
      # workflows) has nothing to compile or test.
      - name: What is left to prove
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REF: ${{ github.event.merge_group.head_ref }}
          GH_TOKEN: ${{ github.token }}
          SPLIT: ${{ inputs.split }}
        run: |
          git cat-file -e "$BASE^{commit}" 2> /dev/null || git fetch -q origin "$BASE"
          reason=""
          proven=""
          if [ "$EVENT" = merge_group ]; then
            number=$(sed -nE 's|.*/pr-([0-9]+)-[0-9a-f]+$|\1|p' <<< "$HEAD_REF")
            if [ -n "$number" ]; then
              pr=$(curl --proto '=https' -sSf --retry 6 -H "Authorization: Bearer $GH_TOKEN" \
                "https://api.github.com/repos/$GITHUB_REPOSITORY/pulls/$number")
              head=$(jq -r .head.sha <<< "$pr")
              echo "branch=$(jq -r .head.ref <<< "$pr")" >> "$GITHUB_OUTPUT"
              git fetch -q origin "$head"
              if [ "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse "$head^{tree}")" ]; then
                passed="the group's tree is pull request #$number's head, whose check passed"
                # Unsplit, the pull request ran the docs too.
                if [ "$SPLIT" = true ]; then proven=$passed; else reason=$passed; fi
              fi
            fi
          fi
          if [ -z "$reason" ] && [ "$FULL" != true ]; then
            never='^(\.github/|[^/]+\.md$|LICENSE$|\.gitignore$|\.gitattributes$|renovate\.json$|_typos\.toml$|\.markdownlint-cli2\.yaml$|lefthook\.yml$|committed\.toml$|release-plz\.toml$|package\.json$|bun\.lock$|codecov\.yml$)'
            # The check's own workflow and actions prove themselves by running.
            check='^\.github/(actions/|workflows/(ci|rust-ci|rust-ci-part)\.yml$)'
            if ! git diff --name-only "$BASE...HEAD" | grep -qE "$check" &&
              ! git diff --name-only "$BASE...HEAD" | grep -qvE "$never"; then
              reason="no file that builds changed"
            fi
          fi
          if [ -n "$reason" ]; then
            echo "nothing to check: $reason" | tee -a "$GITHUB_STEP_SUMMARY"
          elif [ -n "$proven" ]; then
            echo "only the docs part to check: $proven" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          echo "skip=$reason" >> "$GITHUB_OUTPUT"
          echo "proven=$proven" >> "$GITHUB_OUTPUT"
          # The full suite runs cargo-deny itself; fuzz/ is a workspace of its
          # own, which `cargo deny check` at the root does not read.
          deny=false
          if [ -z "$reason" ] && [ "$FULL" != true ] &&
            git diff --name-only "$BASE...HEAD" | grep -E '(^|/)Cargo\.(toml|lock)$|^deny\.toml$' | grep -qv '^fuzz/'; then
            deny=true
          fi
          echo "deny=$deny" >> "$GITHUB_OUTPUT"

      # One runner per part through rust-ci-part.yml; the trybuild test and
      # the stable surface wait for the job `list` in the job `api`.
      - name: Parts
        id: parts
        env:
          EVENT: ${{ github.event_name }}
          FULL: ${{ inputs.full }}
          PROVEN: ${{ steps.scope.outputs.proven }}
          SEMVER: ${{ inputs.semver }}
          SPLIT: ${{ inputs.split }}
        run: |
          if [ "$SPLIT" != true ]; then
            parts=(all)
          elif [ -n "$PROVEN" ]; then
            parts=(docs)
          else
            parts=(host windows-lint)
            # The workspace's doctests and rustdoc run in the merge queue, on
            # main and in the full suite, which keeps the pull request lane
            # short.
            if [ "$EVENT" != pull_request ] || [ "$FULL" = true ]; then parts+=(docs); fi
            # A pull request also fuzzes, briefly, the targets its change
            # reaches; a push to main fuzzes every target and fills the fuzz
            # build cache pull requests restore.
            if [ "$EVENT" = pull_request ] || [ "$EVENT" = push ]; then parts+=(fuzz); fi
            if [ -n "$SEMVER" ]; then parts+=(semver); fi
          fi
          echo "parts=$(jq -cn '$ARGS.positional' --args "${parts[@]}")" | tee -a "$GITHUB_OUTPUT"

  # What only the repository's xtask knows, built once and off the parts'
  # critical path: the API parts a pull request's change needs and the
  # packages whose Windows tests the change reaches. A push to main lists
  # too, so the build cache pull requests restore holds xtask; the merge
  # queue runs every API part. A listing that fails leaves every API part
  # and every Windows test to run, so a broken xtask fails in the jobs that
  # name the fault.
  list:
    needs: scope
    if: inputs.split && needs.scope.outputs.skip == '' && needs.scope.outputs.proven == ''
    runs-on: ubuntu-26.04
    # A cold xtask build, after a toolchain bump.
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      BASE: ${{ github.event.merge_group.base_sha || format('origin/{0}', github.base_ref || github.event.repository.default_branch) }}
      FULL: ${{ inputs.full || (github.event_name != 'pull_request' && github.event_name != 'merge_group') }}
      # The stable surface runs on pull requests too: it is the one build
      # without `unstable`, so an item moved behind it, or code only
      # unstable items use, breaks there alone.
      API_PARTS: trybuild stable-api
    outputs:
      api: ${{ steps.listing.outputs.api }}
      windows: ${{ steps.listing.outputs.windows }}
      windows-listed: ${{ steps.listing.outputs.windows-listed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch the base
        run: git cat-file -e "$BASE^{commit}" 2> /dev/null || git fetch -q origin "$BASE"

      # Only the toolchain and xtask's own build: the rustup cache is the
      # parts' own, so only they store it.
      - continue-on-error: true
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.tool_cache }}/rustup
          key: rustup-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}
      - continue-on-error: true
        uses: ./.github/actions/setup-rust
        with:
          cross: false
      - continue-on-error: true
        uses: ./.github/actions/sccache
        with:
          store: ${{ env.STORE_CACHES }}
      - continue-on-error: true
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v1-rust
          key: list
          save-if: ${{ env.STORE_CACHES }}

      # `shell: bash` adds pipefail, without which xargs would hide a failed
      # listing as an empty one.
      - name: The API parts the change needs
        id: api
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        continue-on-error: true
        shell: bash
        run: |
          args=()
          if [ "$FULL" = true ]; then args+=(--all); else args+=(--base "$BASE"); fi
          for part in $API_PARTS; do args+=(--part "$part"); done
          parts=$(cargo xtask check "${args[@]}" --list parts | xargs)
          echo "parts=$parts" >> "$GITHUB_OUTPUT"

      # `cargo metadata --no-deps`, which the listing reads, does not depend
      # on the host, so the Windows runner starts only when a test is due.
      - name: The Windows tests the change needs
        id: windows
        if: inputs.windows-tests
        continue-on-error: true
        shell: bash
        run: |
          args=()
          if [ "$FULL" = true ]; then args+=(--all); else args+=(--base "$BASE"); fi
          tests=$(cargo xtask check "${args[@]}" --list windows-tests | xargs)
          echo "tests=$tests" >> "$GITHUB_OUTPUT"

      - name: Listing
        id: listing
        env:
          API_OUTCOME: ${{ steps.api.outcome }}
          API: ${{ steps.api.outputs.parts }}
          WINDOWS_OUTCOME: ${{ steps.windows.outcome }}
          WINDOWS: ${{ steps.windows.outputs.tests }}
        run: |
          api=$API_PARTS
          if [ "$API_OUTCOME" = success ]; then api=$API; fi
          read -ra parts <<< "$api"
          listed=false
          if [ "$WINDOWS_OUTCOME" = success ]; then listed=true; fi
          {
            echo "API parts: ${api:-none}"
            if [ "$listed" = true ]; then echo "Windows tests: ${WINDOWS:-none}"; else echo "Windows tests: every crate that has them"; fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
          {
            echo "api=$(jq -cn '$ARGS.positional' --args "${parts[@]}")"
            echo "windows=$WINDOWS"
            echo "windows-listed=$listed"
          } >> "$GITHUB_OUTPUT"

  part:
    name: part (${{ matrix.part }})
    needs: scope
    if: needs.scope.outputs.skip == ''
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(needs.scope.outputs.parts) }}
    uses: ./.github/workflows/rust-ci-part.yml
    with:
      part: ${{ matrix.part }}
      full: ${{ inputs.full }}
      semver: ${{ inputs.semver }}
      deny: ${{ needs.scope.outputs.deny == 'true' }}

  # The parts the job `list` names.
  api:
    name: part (${{ matrix.part }})
    needs: list
    if: needs.list.outputs.api != '[]'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(needs.list.outputs.api) }}
    uses: ./.github/workflows/rust-ci-part.yml
    with:
      part: ${{ matrix.part }}
      full: ${{ inputs.full }}
      semver: ${{ inputs.semver }}

  # The tests of the crates marked `windows-tests` or `windows-only`, natively
  # on Windows. With `split` the job `list` names the ones a change touches,
  # and the job starts only when it names one; without, or when the listing
  # failed, every such crate of the workspace runs.
  windows:
    needs: [scope, list]
    if: >-
      !cancelled() && inputs.windows-tests && needs.scope.result == 'success' &&
      needs.scope.outputs.skip == '' && needs.scope.outputs.proven == '' &&
      (needs.list.outputs.windows-listed != 'true' || needs.list.outputs.windows != '')
    runs-on: windows-2025
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the toolchain
        run: |
          rustup toolchain install
          rustc --version

      - uses: ./.github/actions/sccache
        with:
          store: ${{ env.STORE_CACHES }}

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v1-rust
          key: windows
          save-if: ${{ env.STORE_CACHES }}

      - name: Windows tests to run
        id: list
        env:
          LISTED: ${{ needs.list.outputs.windows-listed }}
          LISTED_TESTS: ${{ needs.list.outputs.windows }}
        run: |
          if [ "$LISTED" = true ]; then
            tests=$LISTED_TESTS
          else
            tests=$(cargo metadata --no-deps --format-version 1 | jq -r \
              '.packages[] | select(.metadata.xtask["windows-tests"] == true or .metadata.xtask["windows-only"] == true) | .name' |
              xargs)
          fi
          echo "Windows tests: ${tests:-none}"
          echo "tests=$tests" >> "$GITHUB_OUTPUT"

      # One test thread: the hook and patch tests share the process.
      - name: Windows tests
        if: steps.list.outputs.tests != ''
        env:
          TESTS: ${{ steps.list.outputs.tests }}
        run: |
          packages=()
          for package in $TESTS; do packages+=(-p "$package"); done
          status=0
          cargo test --target x86_64-pc-windows-msvc "${packages[@]}" -- --test-threads 1 || status=$?
          if [ "$status" != 0 ]; then
            # A crash takes the harness's buffered output with it: run the
            # library tests one by one to name the ones that crash.
            echo "::group::Each test alone"
            cargo test --quiet --target x86_64-pc-windows-msvc "${packages[@]}" --lib -- --list --format terse |
              sed -n 's/: test$//p' > "$RUNNER_TEMP/tests.txt"
            exe=$(cargo test --no-run --message-format json --target x86_64-pc-windows-msvc "${packages[@]}" --lib |
              grep '"test":true' | grep -o '"executable":"[^"]*"' | head -1 | sed 's/^"executable":"//; s/"$//; s/\\\\/\//g')
            while read -r name; do
              "$exe" --exact "$name" --test-threads 1 > /dev/null 2>&1 || echo "::error::crashed or failed alone: $name"
            done < "$RUNNER_TEMP/tests.txt"
            echo "::endgroup::"
          fi
          exit "$status"

      - name: sccache statistics
        if: ${{ !cancelled() && env.RUSTC_WRAPPER == 'sccache' }}
        run: sccache --show-stats

  # The required check: every part passed, or there was nothing to prove.
  # In the merge queue main must be green too, judged when the entry is
  # done: only a fix or a revert merges onto a red main, so it goes first.
  check:
    needs: [scope, list, part, api, windows]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - name: Result
        # pipefail: a failed read of main's runs fails the entry, never
        # passes it.
        shell: bash
        env:
          SCOPE: ${{ needs.scope.result }}
          LIST: ${{ needs.list.result }}
          PART: ${{ needs.part.result }}
          API: ${{ needs.api.result }}
          WINDOWS: ${{ needs.windows.result }}
          EVENT: ${{ github.event_name }}
          BRANCH: ${{ needs.scope.outputs.branch }}
          GH_TOKEN: ${{ github.token }}
          MAIN: ${{ github.event.repository.default_branch }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          echo "scope: $SCOPE, listing: $LIST, parts: $PART, API parts: $API, Windows tests: $WINDOWS"
          ok() { [ "$1" = success ] || [ "$1" = skipped ]; }
          if ! { [ "$SCOPE" = success ] && ok "$LIST" && ok "$PART" && ok "$API" && ok "$WINDOWS"; }; then exit 1; fi
          [ "$EVENT" = merge_group ] || exit 0
          # The caller's workflow file: a called workflow's context is its caller's.
          workflow=${WORKFLOW_REF%%@*}
          workflow=${workflow##*/}
          # The newest run on main that says something: a cancelled, stale or
          # skipped run says nothing, a neutral one passed, a first attempt still running is not known yet,
          # and a re-run still running stays as red as the run it repeats.
          red=$(curl --proto '=https' -sSf --retry 6 -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs?branch=$MAIN&per_page=30" |
            jq -r '[.workflow_runs[] | select(.event == "push" or .event == "workflow_dispatch")
                | select(.status == "completed" or .run_attempt > 1)
                | select(.conclusion | IN("cancelled", "stale", "skipped") | not)][0]
              | select(. != null and (.conclusion | IN("success", "neutral") | not)) | .html_url')
          if [ -z "$red" ]; then
            echo "$MAIN is green"
            exit 0
          fi
          case "$BRANCH" in
            fix/* | revert/* | revert-*)
              echo "$MAIN is red ($red); $BRANCH fixes it and goes first" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
              ;;
          esac
          message="$MAIN is red: $red. Only a fix/ or revert branch merges until it is green; re-run that run if it failed by chance, or queue again once main is green"
          echo "::error::$message"
          echo "$message" >> "$GITHUB_STEP_SUMMARY"
          exit 1
