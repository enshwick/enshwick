name: Rust CI

# `cargo xtask check` for a pull request, a merge queue entry or a push to
# main, on GitHub-hosted runners, with the toolchain, the Windows SDK and the
# build cached between runs; a push to main runs the full suite and fills the
# caches pull requests start from. With `split` the host check and the
# Windows lint run as parallel jobs. The Windows tests run natively on a
# Windows runner. The job `check` sums them up and is the required check.

on:
  workflow_call:
    inputs:
      full:
        description: Run the full suite instead of the packages a change touches.
        type: boolean
        default: false
      windows-tests:
        description: Run the Windows-only crates' tests natively on a GitHub-hosted Windows runner.
        type: boolean
        default: true
      split:
        description: Run the host check and the Windows lint as parallel jobs and only the Windows tests a change touches; the repository's `cargo xtask check` must know `--part` and `--list-windows-tests`.
        type: boolean
        default: false
      semver:
        description: Packages checked with cargo-semver-checks against their last release on crates.io, space-separated; none when empty.
        type: string
        default: ""

permissions: {}

jobs:
  scope:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      skip: ${{ steps.scope.outputs.skip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Work already proven is not repeated: a merge queue group whose tree
      # is its pull request's own head passed that pull request's check, and
      # a change to files that never build (documents outside the book,
      # repository settings, other workflows) has nothing to compile or test.
      - name: What is left to prove
        id: scope
        env:
          # A merge queue entry is checked against the entry before it (its
          # group's parent): only its own pull request's changes are new.
          BASE: ${{ github.event.merge_group.base_sha || format('origin/{0}', github.base_ref || github.event.repository.default_branch) }}
          EVENT: ${{ github.event_name }}
          FULL: ${{ inputs.full || (github.event_name != 'pull_request' && github.event_name != 'merge_group') }}
          HEAD_REF: ${{ github.event.merge_group.head_ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git cat-file -e "$BASE^{commit}" 2> /dev/null || git fetch -q origin "$BASE"
          reason=""
          if [ "$EVENT" = merge_group ]; then
            number=$(sed -nE 's|.*/pr-([0-9]+)-[0-9a-f]+$|\1|p' <<< "$HEAD_REF")
            if [ -n "$number" ]; then
              head=$(curl --proto '=https' -sSf -H "Authorization: Bearer $GH_TOKEN" \
                "https://api.github.com/repos/$GITHUB_REPOSITORY/pulls/$number" | jq -r .head.sha)
              git fetch -q origin "$head"
              if [ "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse "$head^{tree}")" ]; then
                reason="the group's tree is pull request #$number's head, whose check passed"
              fi
            fi
          fi
          if [ -z "$reason" ] && [ "$FULL" != true ]; then
            never='^(\.github/|[^/]+\.md$|(.*/)?CHANGELOG\.md$|LICENSE$|\.gitignore$|\.gitattributes$|renovate\.json$|_typos\.toml$|\.markdownlint-cli2\.yaml$|lefthook\.yml$|committed\.toml$|release-plz\.toml$|package\.json$|bun\.lock$)'
            # The check's own workflow and actions prove themselves by running.
            check='^\.github/(actions/|workflows/(ci|rust-ci)\.yml$)'
            if ! git diff --name-only "$BASE...HEAD" | grep -qE "$check" &&
              ! git diff --name-only "$BASE...HEAD" | grep -qvE "$never"; then
              reason="no file that builds changed"
            fi
          fi
          if [ -n "$reason" ]; then
            echo "nothing to check: $reason" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          echo "skip=$reason" >> "$GITHUB_OUTPUT"

  part:
    needs: scope
    if: needs.scope.outputs.skip == ''
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(inputs.split && '["host", "windows-lint"]' || '["all"]') }}
    env:
      # A merge queue entry is checked against the entry before it (its
      # group's parent): only its own pull request's changes are new.
      BASE: ${{ github.event.merge_group.base_sha || format('origin/{0}', github.base_ref || github.event.repository.default_branch) }}
      FULL: ${{ inputs.full || (github.event_name != 'pull_request' && github.event_name != 'merge_group') }}
      PART: ${{ matrix.part }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch the base
        run: git cat-file -e "$BASE^{commit}" 2> /dev/null || git fetch -q origin "$BASE"

      # Nothing persists between jobs: the toolchain, the Windows SDK and the
      # apt packages come from the cache.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.tool_cache }}/rustup
          key: rustup-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml') }}
      # The Windows SDK and CRT cargo-xwin downloads, about 12 minutes from
      # Microsoft on a hosted runner. Only the cross-compiling parts here
      # (`windows-lint`, `all`) use it; the job `windows` builds natively.
      - if: matrix.part != 'host'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.tool_cache }}/xwin
          key: xwin-${{ runner.os }}-0.23.1-v1
      # clang of the toolchain's LLVM.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.tool_cache }}/apt-archives
          key: apt-${{ runner.os }}-${{ matrix.part }}-v2

      - uses: ./.github/actions/setup-rust
        with:
          tools: cargo-nextest@0.9.150,cargo-deny@0.20.2,cargo-machete@0.9.2${{ inputs.semver != '' && matrix.part != 'windows-lint' && ',cargo-semver-checks@0.51.0' || '' }}
          ast-grep: ${{ matrix.part != 'windows-lint' }}

      # The build itself, per part: each job builds a different target.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # A cache saved by a failed run would be restored as it is and
          # never replaced, so only a finished run saves one.
          prefix-key: v1-rust
          key: ${{ matrix.part }}

      - name: cargo xtask check
        run: |
          args=()
          if [ "$FULL" = true ]; then args+=(--all); else args+=(--base "$BASE"); fi
          if [ "$PART" != all ]; then args+=(--part "$PART"); fi
          if [ "$PART" = all ] || [ "$PART" = host ]; then cargo fmt --all --check; fi
          cargo xtask check "${args[@]}"

      # A version that claims less change than the public API made fails;
      # unreleased changes keep the released version and pass.
      - name: cargo semver-checks
        if: inputs.semver != '' && (matrix.part == 'all' || matrix.part == 'host')
        env:
          PACKAGES: ${{ inputs.semver }}
        run: |
          args=()
          for package in $PACKAGES; do args+=(--package "$package"); done
          cargo semver-checks "${args[@]}"

  # The tests of the crates marked `windows-tests` or `windows-only`, natively
  # on Windows. With `split` the repository's `cargo xtask check` lists the
  # ones a change touches; without, every such crate of the workspace runs.
  windows:
    needs: scope
    if: inputs.windows-tests && needs.scope.outputs.skip == ''
    runs-on: windows-2025
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      BASE: ${{ github.event.merge_group.base_sha || format('origin/{0}', github.base_ref || github.event.repository.default_branch) }}
      FULL: ${{ inputs.full || (github.event_name != 'pull_request' && github.event_name != 'merge_group') }}
      SPLIT: ${{ inputs.split }}
      CARGO_INCREMENTAL: "0"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch the base
        run: git cat-file -e "$BASE^{commit}" 2> /dev/null || git fetch -q origin "$BASE"

      - name: Install the toolchain
        run: |
          rustup toolchain install
          rustc --version

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: v1-rust
          key: windows
          # Branch caches would fill the repository's cache storage and evict
          # the entries main's runs and pull requests restore.
          save-if: ${{ github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Windows tests to run
        id: list
        run: |
          if [ "$SPLIT" = true ]; then
            args=()
            if [ "$FULL" = true ]; then args+=(--all); else args+=(--base "$BASE"); fi
            tests=$(cargo xtask check "${args[@]}" --list-windows-tests | xargs)
          else
            tests=$(cargo metadata --no-deps --format-version 1 | jq -r \
              '.packages[] | select(.metadata.enshwick["windows-tests"] == true or .metadata.enshwick["windows-only"] == true) | .name' |
              xargs)
          fi
          echo "Windows tests: ${tests:-none}"
          echo "tests=$tests" >> "$GITHUB_OUTPUT"

      # One test thread: the hook and patch tests share the process.
      - name: Windows tests
        if: steps.list.outputs.tests != ''
        env:
          TESTS: ${{ steps.list.outputs.tests }}
        run: |
          packages=()
          for package in $TESTS; do packages+=(-p "$package"); done
          status=0
          cargo test --target x86_64-pc-windows-msvc "${packages[@]}" -- --test-threads 1 || status=$?
          if [ "$status" != 0 ]; then
            # A crash takes the harness's buffered output with it: run the
            # library tests one by one to name the ones that crash.
            echo "::group::Each test alone"
            cargo test --quiet --target x86_64-pc-windows-msvc "${packages[@]}" --lib -- --list --format terse |
              sed -n 's/: test$//p' > "$RUNNER_TEMP/tests.txt"
            exe=$(cargo test --no-run --message-format json --target x86_64-pc-windows-msvc "${packages[@]}" --lib |
              grep '"test":true' | grep -o '"executable":"[^"]*"' | head -1 | sed 's/^"executable":"//; s/"$//; s/\\\\/\//g')
            while read -r name; do
              "$exe" --exact "$name" --test-threads 1 > /dev/null 2>&1 || echo "::error::crashed or failed alone: $name"
            done < "$RUNNER_TEMP/tests.txt"
            echo "::endgroup::"
          fi
          exit "$status"

  # The required check: every part passed, or there was nothing to prove.
  check:
    needs: [scope, part, windows]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Result
        env:
          SCOPE: ${{ needs.scope.result }}
          PART: ${{ needs.part.result }}
          WINDOWS: ${{ needs.windows.result }}
        run: |
          echo "scope: $SCOPE, parts: $PART, Windows tests: $WINDOWS"
          ok() { [ "$1" = success ] || [ "$1" = skipped ]; }
          [ "$SCOPE" = success ] && ok "$PART" && ok "$WINDOWS"
