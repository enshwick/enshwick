# Release pull requests and releases per crate.
# Each release gets its own archive: a mod's DLL, or the stub and loader; the
# loader's release also carries the full bundle, everything as it goes next to the game.
name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      created: ${{ steps.release.outputs.releases_created }}
      all: ${{ toJSON(steps.release.outputs) }}
    steps:
      # v5.0.0
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main

  bundle:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Build
        run: cargo build --release --workspace --locked

      - name: Archives
        run: |
          pack() { (cd "$1" && 7z a -tzip "../$2" . > /dev/null); }
          mkdir -p all/mods/enshwick loader/mods/enshwick
          for dir in all loader; do
            cp target/release/powrprof.dll "$dir/"
            cp target/release/enshwick.dll "$dir/mods/enshwick/"
            cp LICENSE "$dir/"
          done
          for dll in target/release/enshwick_*.dll; do
            name=$(basename "$dll" .dll | tr '_' '-')
            mkdir -p "$name/mods"
            cp "$dll" "$name/mods/$name.dll"
            cp LICENSE "$name/"
            cp "$dll" "all/mods/$name.dll"
            pack "$name" "$name.zip"
          done
          pack loader enshwick-loader.zip
          pack all enshwick.zip

      - name: Attach
        env:
          GH_TOKEN: ${{ github.token }}
          OUTPUTS: ${{ needs.release-please.outputs.all }}
        run: |
          # jq on Windows ends lines with CRLF; the tags must not keep the CR.
          echo "$OUTPUTS" | jq -r 'to_entries[] | select(.key | endswith("--tag_name")) | .value' | tr -d '\r' |
            while read -r tag; do
              component=${tag%-v*}
              case "$component" in
                enshwick-loader|enshwick-stub) files="enshwick-loader.zip enshwick.zip" ;;
                *) [ -f "$component.zip" ] && files="$component.zip" || files="" ;;
              esac
              for file in $files; do
                gh release upload "$tag" "$file" --clobber --repo "$GITHUB_REPOSITORY"
              done
            done
