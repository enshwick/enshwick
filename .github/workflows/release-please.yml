# Release pull requests and releases per crate.
# The platform crates (loader, stub, API, macros, reflect, cargo-enshwick)
# share one version and release together as "Enshwick Loader X.Y.Z"; mods keep
# their own.
# Each mod's release gets its archive with the mod's DLL; the loader's release,
# the platform release, carries the stub and loader and the full bundle,
# everything as it goes next to the game.
# Each archive has a minisign signature beside it, `<archive>.minisig`.
name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

# Two merges in a row must not build and upload at once: the later run could
# edit the platform release before the earlier one has attached its archives.
concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      created: ${{ steps.release.outputs.releases_created }}
      all: ${{ toJSON(steps.release.outputs) }}
    steps:
      # v5.0.0
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main

  bundle:
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Build
        run: cargo build --release --workspace --locked

      - name: Archives
        run: |
          pack() { (cd "$1" && 7z a -tzip "../$2" . > /dev/null); }
          mkdir -p all/mods/enshwick loader/mods/enshwick
          for dir in all loader; do
            cp target/release/powrprof.dll "$dir/"
            cp target/release/enshwick.dll "$dir/mods/enshwick/"
            cp LICENSE "$dir/"
          done
          # Mods are the packages under mods/; other DLLs in target, such as
          # proc macros, stay out. Each archive is named after the package,
          # which is the release component, and the DLL after the library
          # target, whatever the folder is called. jq on Windows ends lines
          # with CRLF. A development mod marks itself
          # `[package.metadata.enshwick] release = false` and stays out.
          cargo metadata --no-deps --format-version 1 --locked |
            jq -r '.workspace_root as $root | .packages[]
              | select(.manifest_path | ltrimstr($root) | gsub("\\\\"; "/") | startswith("/mods/"))
              | select(.metadata.enshwick.release != false)
              | [.name, (.targets[] | select(.kind | index("cdylib")) | .name)] | @tsv' |
            tr -d '\r' > "$RUNNER_TEMP/mods.tsv"
          [ -s "$RUNNER_TEMP/mods.tsv" ] || { echo "cargo metadata lists no mods"; exit 1; }
          while IFS=$'\t' read -r name lib; do
            dll="target/release/$lib.dll"
            mkdir -p "$name/mods"
            cp "$dll" "$name/mods/$name.dll"
            cp LICENSE "$name/"
            cp "$dll" "all/mods/$name.dll"
            pack "$name" "$name.zip"
          done < "$RUNNER_TEMP/mods.tsv"
          pack loader enshwick-loader.zip
          pack all enshwick.zip

      - name: Versions
        env:
          OUTPUTS: ${{ needs.release-please.outputs.all }}
        run: |
          # Every released mod's DLL carries the version of its tag, which the
          # loader names in its messages.
          tags=$(echo "$OUTPUTS" | jq -r 'to_entries[] | select(.key | endswith("--tag_name")) | .value' | tr -d '\r')
          for tag in $tags; do
            component=${tag%-v*}
            lib=$(awk -F '\t' -v c="$component" '$1 == c { print $2 }' "$RUNNER_TEMP/mods.tsv")
            [ -n "$lib" ] || continue
            target/release/cargo-enshwick enshwick manifest "target/release/$lib.dll" --expect-version "${tag##*-v}"
          done

      - name: Signing tool
        run: cargo install --locked rsign2@0.6.7

      - name: Attach
        env:
          GH_TOKEN: ${{ github.token }}
          OUTPUTS: ${{ needs.release-please.outputs.all }}
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          # Every archive goes up with a minisign signature, which the updater
          # checks against the key in mods/enshwick-updater/keys. The trusted
          # comment names the tag and the file, so a signed archive cannot be
          # passed off as another release.
          key="$RUNNER_TEMP/minisign.key"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key"
          # jq on Windows ends lines with CRLF; the tags must not keep the CR.
          echo "$OUTPUTS" | jq -r 'to_entries[] | select(.key | endswith("--tag_name")) | .value' | tr -d '\r' |
            while read -r tag; do
              component=${tag%-v*}
              case "$component" in
                enshwick-loader) files="enshwick-loader.zip enshwick.zip" ;;
                *) [ -f "$component.zip" ] && files="$component.zip" || files="" ;;
              esac
              for file in $files; do
                rsign sign -W -s "$key" -x "$file.minisig" -t "$tag $file" "$file" < /dev/null
                gh release upload "$tag" "$file" "$file.minisig" --clobber --repo "$GITHUB_REPOSITORY"
              done
            done

      - name: Platform release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The other platform crates release with the loader under the same
          # version; the loader's release is the one players download. It is
          # named after the platform and stays the latest release, also after a
          # release of mods alone, so the latest release always has enshwick.zip.
          tag=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName \
            --jq '[.[] | select(.tagName | startswith("enshwick-loader-v"))][0].tagName // empty' | tr -d '\r')
          [ -n "$tag" ] || exit 0
          gh release edit "$tag" --title "Enshwick Loader ${tag##*-v}" --latest --repo "$GITHUB_REPOSITORY"

  # The loader's build tables, crates/internal/builds/tables/*.toml, go up as
  # files of the release `build-tables`, each with a minisign signature whose
  # trusted comment is `build-table <file>`. The updater fetches the table of
  # a game build the loader has none for, and the loader uses it only with
  # that signature, so a game patch needs a new table, not a loader release.
  build-tables:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Changed tables
        id: changed
        env:
          BEFORE: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Every table goes up when the release does not exist yet or the
          # previous commit is unknown; otherwise only on a change.
          if ! gh release view build-tables --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 \
            || ! git cat-file -e "$BEFORE^{commit}" 2> /dev/null \
            || ! git diff --quiet "$BEFORE" "$GITHUB_SHA" -- crates/internal/builds/tables; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Signing tool
        if: steps.changed.outputs.publish == 'true'
        run: cargo install --locked rsign2@0.6.7

      - name: Publish
        if: steps.changed.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          key="$RUNNER_TEMP/minisign.key"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$key"
          if ! gh release view build-tables --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create build-tables --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Build tables" --latest=false \
              --notes "The loader's build table for each game build, signed with Enshwick's key. The updater fetches the one a new game build needs; nothing here is downloaded by hand."
          fi
          cd crates/internal/builds/tables
          for file in *.toml; do
            rsign sign -W -s "$key" -x "$file.minisig" -t "build-table $file" "$file" < /dev/null
            gh release upload build-tables "$file" "$file.minisig" --clobber --repo "$GITHUB_REPOSITORY"
          done
