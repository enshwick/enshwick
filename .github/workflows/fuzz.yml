# Every fuzz target for a few seconds, on a pull request that changes what
# the targets read: messages from other players, files people edit, tables,
# patterns, game images and archives. The nightly lane runs them for minutes.
name: fuzz

on:
  pull_request:
    paths:
      - fuzz/**
      - Cargo.lock
      - crates/cargo-enshwick/src/lib.rs
      - crates/cargo-enshwick/src/points.rs
      - crates/cargo-enshwick/src/points/**
      - crates/enshwick-gamedata/src/**
      - crates/enshwick/src/abi.rs
      - crates/enshwick/src/abi/**
      - crates/enshwick/src/actions.rs
      - crates/enshwick/src/actions/**
      - crates/enshwick/src/code.rs
      - crates/enshwick/src/code/**
      - crates/enshwick/src/config.rs
      - crates/enshwick/src/config/**
      - crates/enshwick/src/i18n.rs
      - crates/enshwick/src/packs.rs
      - crates/enshwick/src/packs/**
      - crates/internal/loader/src/admission.rs
      - crates/internal/loader/src/admission/**
      - crates/internal/loader/src/configure.rs
      - crates/internal/loader/src/configure/**
      - crates/internal/loader/src/item_records.rs
      - crates/internal/loader/src/item_records/**
      - crates/internal/loader/src/join.rs
      - crates/internal/loader/src/join/**
      - crates/internal/loader/src/manifest.rs
      - crates/internal/loader/src/migrations.rs
      - crates/internal/loader/src/migrations/**
      - crates/internal/loader/src/modlist.rs
      - crates/internal/loader/src/notice_queue.rs
      - crates/internal/loader/src/remote.rs
      - crates/internal/loader/src/resolve.rs
      - crates/internal/loader/src/settings.rs
      - crates/internal/loader/src/wire.rs
      - crates/internal/loader/src/wire/**
      - crates/internal/loader/src/worlds.rs

permissions: {}

concurrency:
  group: fuzz-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  fuzz:
    # main: reusable workflows come from the organization's main branch.
    uses: enshwick/.github/.github/workflows/rust-fuzz.yml@main # zizmor: ignore[unpinned-uses]
    permissions:
      contents: read
