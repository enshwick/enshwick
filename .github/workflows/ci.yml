# The merge gate: `cargo xtask check` through the shared workflow, as parallel
# parts on GitHub-hosted runners: the changed packages on a pull request and
# in the merge queue, the full suite on a push to main, which also fills the
# build caches pull requests start from.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  # The merge queue checks each group of pull requests on top of main.
  merge_group:

permissions: {}

concurrency:
  # Only a pull request's newer push cancels its older run: a run on main
  # fills the caches pull requests start from and must finish.
  group: ci-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    uses: enshwick/.github/.github/workflows/rust-ci.yml@ci/WIK-169-drop-runner-setup # zizmor: ignore[unpinned-uses]
    permissions:
      contents: read
    with:
      full: true
      semver: enshwick
      split: true
