# The merge gate: `cargo xtask check` through rust-ci.yml, as parallel
# parts on GitHub-hosted runners: the changed packages on a pull request and
# in the merge queue, the full suite on a push to main, which also fills the
# build caches pull requests start from.
name: ci

on:
  # A draft runs nothing; marking it ready runs the check.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  # The merge queue checks each group of pull requests on top of main.
  merge_group:

permissions: {}

concurrency:
  # Only a pull request's newer push cancels its older run: a run on main
  # fills the caches pull requests start from and must finish.
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event.pull_request.draft }} # a draft's late run never cancels a ready one
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Skipped here, a draft reports no `rust / check` at all: a passing one
  # would still count once the pull request is marked ready, before the
  # ready run's own check exists, and on a re-run of the draft's run.
  rust:
    if: github.event.pull_request.draft != true
    uses: ./.github/workflows/rust-ci.yml
    permissions:
      contents: read
    with:
      semver: enshwick
      split: true
