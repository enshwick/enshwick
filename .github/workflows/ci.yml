# The checks of docs/conventions/repository.md, on every push and pull request.
name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      # v2.2.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.3

      - name: Install
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Commit messages
        env:
          BEFORE: ${{ github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          from="${BASE:-$BEFORE}"
          # A new branch, or a previous head no longer in the history: check every commit.
          if [ -z "$from" ] || ! git merge-base --is-ancestor "$from" "$HEAD" 2>/dev/null; then
            range="$HEAD"
          else
            range="$from..$HEAD"
          fi
          bun tools/check-commit-message.ts --range "$range"

      - name: Attribution
        if: ${{ !cancelled() }}
        run: git ls-files -z | xargs -0 bun tools/check-attribution.ts

      - name: Markdown
        if: ${{ !cancelled() }}
        run: bun run lint:md

      # v1.51.1
      - name: Spelling
        if: ${{ !cancelled() }}
        uses: crate-ci/typos@7f9d0819ca1c008ade73f4b41fa9d258d48f605b

  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # v2.1.1
      - if: ${{ hashFiles('Cargo.lock') != '' }}
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - id: workspace
        run: echo "present=$([ -f Cargo.toml ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"

      # v2.9.2
      - if: steps.workspace.outputs.present == 'yes'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6

      - name: Format
        if: steps.workspace.outputs.present == 'yes'
        run: cargo fmt --all --check

      - name: Clippy
        if: steps.workspace.outputs.present == 'yes'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        if: steps.workspace.outputs.present == 'yes'
        run: cargo test --workspace --locked
