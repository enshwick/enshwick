# The merge gate: `cargo xtask check` through the shared workflow, as parallel
# parts: the changed packages on a pull request (GitHub-hosted) and in the
# merge queue (the organization runners), the full suite on a push to main,
# which also fills the build caches pull requests start from, and nightly.
# The nightly lane adds Miri, unused dependencies, coverage, external links,
# benchmarks, the fuzz targets, loom models, Kani proofs and the tests under
# AddressSanitizer.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  # The merge queue checks each group of pull requests on top of main.
  merge_group:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
    inputs:
      nightly:
        description: Also run the nightly lane.
        type: boolean
        default: false

permissions: {}

concurrency:
  # A push to main cancels the push before it, never the nightly run.
  group: ci-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    # main: the organization runners run only workflows from main.
    uses: enshwick/.github/.github/workflows/rust-ci.yml@main # zizmor: ignore[unpinned-uses]
    permissions:
      contents: read
    with:
      semver: enshwick
      split: true

  nightly:
    if: github.event_name == 'schedule' || inputs.nightly
    uses: enshwick/.github/.github/workflows/rust-nightly.yml@main # zizmor: ignore[unpinned-uses]
    permissions:
      contents: read
    with:
      # The pure crates whose tests finish under Miri in minutes; the tests
      # that unpack the archive or parse every table skip themselves there.
      miri: enshwick-gamedata
      fuzz: true
      loom: -p enshwick-loader --test loom_chains
      kani: |
        -p enshwick --lib --tests --features test --harness proofs
        -p enshwick-gamedata --lib --tests --harness proofs
      # The memory reader and the fake host walk raw pointers in these.
      asan: -p enshwick -p enshwick-gamedata -p enshwick-loader --features enshwick/test --lib --tests
