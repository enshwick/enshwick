# The merge gate: `cargo xtask check` on the organization runners through the
# shared workflow, the changed packages on a pull request and the full suite
# nightly.
name: ci

on:
  pull_request:
  # The merge queue checks each group of pull requests on top of main.
  merge_group:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    # main: the organization runners run only workflows from main.
    uses: enshwick/.github/.github/workflows/rust-ci.yml@main # zizmor: ignore[unpinned-uses]
    permissions:
      contents: read
    with:
      semver: enshwick
