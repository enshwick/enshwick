# A development build of the commit it runs on: `cargo xtask dist` on a
# fresh GitHub-hosted runner, its files kept as the run's artefact and its
# archive scanned on VirusTotal. Every push to main that changes what the
# archive builds from runs it, and so saves the Windows SDK cache the alpha
# releases (alpha.yml) restore; players download the alphas.
name: dev-build

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "tools/**"
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - LICENSE
      - .github/workflows/dev-build.yml
      - ".github/actions/**"
  workflow_dispatch:

permissions: {}

# A newer push supersedes the build of an older one.
concurrency:
  group: dev-build
  cancel-in-progress: true

jobs:
  dist:
    # Only main saves the release cache of the Windows SDK.
    if: github.ref == 'refs/heads/main'
    # The release environment admits main only.
    environment: release
    # A fresh machine: what ships is built and published without the
    # caches that branch builds write to.
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      HAS_VIRUSTOTAL_KEY: ${{ secrets.VIRUSTOTAL_API_KEY != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The Windows SDK and CRT that cargo-xwin downloads, 7 to 9 minutes
      # from Microsoft on a hosted runner. Microsoft's files only, no build
      # output, under a key of their own that only a release build of main
      # saves: a run on main restores no cache a branch wrote.
      - name: Restore the Windows SDK
        id: xwin
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.tool_cache }}/xwin
          key: xwin-release-${{ runner.os }}-0.23.1-v1
      - uses: ./.github/actions/setup-rust
        with:
          gh: true
          tools: cargo-cyclonedx@0.5.9,cargo-auditable@0.7.7

      # The archive, and the PDB and SBOM of every DLL.
      - uses: ./.github/actions/release-files
        with:
          out: ${{ runner.temp }}/dev

      - name: Save the Windows SDK
        if: steps.xwin.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.tool_cache }}/xwin
          key: xwin-release-${{ runner.os }}-0.23.1-v1

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: enshwick-${{ github.sha }}
          path: ${{ runner.temp }}/dev/*
          if-no-files-found: error

      # VirusTotal unpacks and scans each archive; the engines that flag it
      # go to the run's summary and a warning, so a false positive reaches
      # its vendor before a release. A flag or an outage never turns the
      # build red. The public API takes four requests a minute.
      - name: VirusTotal
        if: env.HAS_VIRUSTOTAL_KEY == 'true'
        continue-on-error: true
        timeout-minutes: 17
        env:
          VT_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}
        working-directory: ${{ runner.temp }}/dev
        run: |
          api=https://www.virustotal.com/api/v3
          # Twenty seconds between retries outlast the per-minute limit.
          vt() { curl -fsS --proto '=https' --retry 3 --retry-delay 20 -H "x-apikey: $VT_API_KEY" "$@"; }
          for archive in *.zip; do
            sha=$(sha256sum "$archive" | cut -d' ' -f1)
            link="https://www.virustotal.com/gui/file/$sha"
            # The archive is reproducible: one VirusTotal knows keeps its last analysis.
            if known=$(vt "$api/files/$sha" 2> /dev/null) &&
              jq -e '.data.attributes.last_analysis_results | length > 0' <<< "$known" > /dev/null; then
              verdict=$(jq -c '.data.attributes | {stats: .last_analysis_stats, results: .last_analysis_results}' <<< "$known")
            else
              if ! id=$(vt -F "file=@$archive" "$api/files" | jq -er .data.id); then
                echo "::warning title=VirusTotal::the upload of $archive failed"
                continue
              fi
              status=queued
              # Fifteen minutes at most; a failed poll counts as not done yet.
              for _ in $(seq 45); do
                sleep 20
                analysis=$(vt "$api/analyses/$id") || continue
                status=$(jq -r .data.attributes.status <<< "$analysis")
                [ "$status" = completed ] && break
              done
              if [ "$status" != completed ]; then
                echo "::warning title=VirusTotal::$archive is still $status: $link"
                continue
              fi
              verdict=$(jq -c '.data.attributes | {stats, results}' <<< "$analysis")
            fi
            stats=$(jq -r '.stats | "\(.malicious) malicious, \(.suspicious) suspicious, \(.undetected) undetected"' <<< "$verdict")
            flagged=$(jq -r 'def cell: tostring | gsub("[|]"; "&#124;");
              .results[] | select(.category == "malicious" or .category == "suspicious")
              | "| \(.engine_name | cell) | \(.category) | \(.result // "" | cell) |"' <<< "$verdict")
            {
              echo "### VirusTotal: $archive"
              echo
              echo "$stats: [report]($link)"
              if [ -n "$flagged" ]; then
                echo
                echo "| Engine | Category | Result |"
                echo "| --- | --- | --- |"
                echo "$flagged"
              fi
            } >> "$GITHUB_STEP_SUMMARY"
            if [ -n "$flagged" ]; then
              echo "::warning title=VirusTotal::$archive: $stats, $link"
            fi
          done
