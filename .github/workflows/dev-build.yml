# A development build of the commit it runs on, until the first public
# release, 1.0.0: `cargo xtask bundle` on the organization's runners, whose
# archives replace the files of the single prerelease `dev`. enshwick.zip
# there holds everything that goes into the game folder.
name: dev-build

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Replace the dev prerelease; off builds the archives only
        type: boolean
        default: true

permissions: {}

concurrency:
  group: dev-build
  cancel-in-progress: false

jobs:
  bundle:
    permissions:
      contents: write
      # The build provenance attestations of the archives.
      id-token: write
      attestations: write
    # From main: the runners take only enshwick/.github's workflows on main.
    uses: enshwick/.github/.github/workflows/dev-bundle.yml@main # zizmor: ignore[unpinned-uses]
    with:
      publish: ${{ inputs.publish }}

  # The site lists the mods of the dev bundle; start its build once the
  # prerelease changed.
  docs:
    needs: bundle
    if: inputs.publish
    uses: enshwick/.github/.github/workflows/docs-rebuild.yml@main # zizmor: ignore[unpinned-uses]
    secrets:
      ENSHWICK_CI_CLIENT_ID: ${{ secrets.ENSHWICK_CI_CLIENT_ID }}
      ENSHWICK_CI_PRIVATE_KEY: ${{ secrets.ENSHWICK_CI_PRIVATE_KEY }}
