# Release pull requests and releases with release-plz (release-plz.toml), on
# main only. `release-pr` opens or updates the release pull request, and
# `changelogs` joins the change files into it; `release`, after that pull
# request merged, tags each released crate `<package>-v<version>` and the
# loader `v<version>`, and publishes the public crates to crates.io through
# trusted publishing, which matches this file's name. When the loader is
# among them, `loader` makes the one GitHub release of the version with the
# release workflow (release.yml). A push to main runs both, but only while
# the repository variable RELEASE_ON_MERGE is `true`; until the first real
# release it is unset and releases run by hand.
name: release-plz

on:
  push:
    branches: [main]
    paths:
      - crates/**
      - Cargo.toml
      - Cargo.lock
      - release-plz.toml
  workflow_dispatch:
    inputs:
      command:
        description: What to run
        type: choice
        options:
          - release-pr
          - release
        default: release-pr
      known_issues:
        description: Known issues of the loader's release, as Markdown; empty says none are reported
        type: string
        default: ""

permissions: {}

jobs:
  release:
    # Releases come only from main; a push releases only once switched on.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' || vars.RELEASE_ON_MERGE == 'true') &&
      inputs.command != 'release-pr'
    # The release environment admits main only.
    environment: release
    # A fresh machine: what ships is built and published without the
    # caches that branch builds write to.
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      # Whether this commit merged a release pull request.
      pull-requests: read
      # crates.io trusted publishing.
      id-token: write
    # One group per commit: in a shared group a later merge would cancel the
    # pending run of a merged release pull request, and `release` acts only
    # on that commit.
    concurrency:
      group: release-plz-release-${{ github.sha }}
      cancel-in-progress: false
    outputs:
      loader: ${{ steps.loader.outputs.released }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-rust
      - uses: ./.github/actions/gh

      # release-plz releases only on the commit that merged a release pull
      # request (release_always), whose branch it names `release-plz-…`. On
      # that commit a loader version without its tag releases, so it stops
      # the run before anything goes to crates.io when the notes are refused
      # or the version is an alpha, which only release.yml releases, by hand.
      # Any other commit releases nothing and skips the check.
      - name: The loader's notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(cargo pkgid --locked -p enshwick-loader)
          version=${version##*[#@]}
          if git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
            exit 0
          fi
          merged=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
            --jq '[.[] | select(.merged_at != null and (.head.ref | startswith("release-plz-")))] | length')
          if [ "$merged" -eq 0 ]; then
            exit 0
          fi
          if [[ "$version" == *-* ]]; then
            echo "::error title=release::$version is a prerelease; an alpha releases only through release.yml, by hand"
            exit 1
          fi
          cargo xtask notes --out "$RUNNER_TEMP/notes.md"

      # The app pushes the tags; the job token may not.
      - name: Token for the release
        id: token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ secrets.ENSHWICK_CI_CLIENT_ID }}
          private-key: ${{ secrets.ENSHWICK_CI_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      # crates.io takes trusted publishing only for a crate it knows, so
      # while the CRATES_IO_TOKEN secret exists the run publishes with it;
      # once crates.io lists this file as each crate's trusted publisher and
      # the secret is gone, the action publishes through trusted publishing.
      - uses: release-plz/action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b # v0.5.148
        id: release-plz
        with:
          command: release
          token: ${{ secrets.CRATES_IO_TOKEN }}
        env:
          GITHUB_TOKEN: ${{ steps.token.outputs.token }}

      - name: Whether the loader released
        id: loader
        env:
          RELEASES: ${{ steps.release-plz.outputs.releases }}
        run: |
          released=$(jq -c 'any(.[]; .package_name == "enshwick-loader")' <<<"${RELEASES:-[]}")
          echo "released=$released" >> "$GITHUB_OUTPUT"

  # The version's GitHub release, on the tag release-plz just pushed, with
  # `enshwick.zip`, `cargo-enshwick` and the notes of every crate. Its jobs
  # run in the release environment, whose secrets reach them only when
  # passed here by name.
  loader:
    needs: release
    if: needs.release.outputs.loader == 'true'
    permissions:
      contents: read
      id-token: write
      attestations: write
    uses: ./.github/workflows/release.yml
    with:
      known_issues: ${{ inputs.known_issues }}
      publish: true
    secrets:
      ENSHWICK_SIGNING_KEY: ${{ secrets.ENSHWICK_SIGNING_KEY }}
      ENSHWICK_CI_CLIENT_ID: ${{ secrets.ENSHWICK_CI_CLIENT_ID }}
      ENSHWICK_CI_PRIVATE_KEY: ${{ secrets.ENSHWICK_CI_PRIVATE_KEY }}
      DOCS_DEPLOY_HOOK: ${{ secrets.DOCS_DEPLOY_HOOK }}
      VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY }}

  release-pr:
    # After `release`, the order the action keeps when given no command;
    # skipped when `release` failed.
    needs: release
    if: >-
      !cancelled() && needs.release.result != 'failure' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' || vars.RELEASE_ON_MERGE == 'true') &&
      inputs.command != 'release'
    # The app's key is a release secret.
    environment: release
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    # A newer run may replace a pending one: it covers the same commits.
    concurrency:
      group: release-plz-pr
      cancel-in-progress: false
    outputs:
      branch: ${{ steps.pr.outputs.branch }}
      packages: ${{ steps.pr.outputs.packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-rust

      # The app pushes the release branch and opens the release pull request,
      # which then runs CI as any other; the job token may not open pull
      # requests.
      - name: Token for the release pull request
        id: token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ secrets.ENSHWICK_CI_CLIENT_ID }}
          private-key: ${{ secrets.ENSHWICK_CI_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - uses: release-plz/action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b # v0.5.148
        id: release-plz
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ steps.token.outputs.token }}

      - name: The release pull request
        id: pr
        env:
          CREATED: ${{ steps.release-plz.outputs.prs_created }}
          PR: ${{ steps.release-plz.outputs.pr }}
        run: |
          if [[ "${CREATED}" != "true" ]]; then
            echo "no release pull request"
            exit 0
          fi
          echo "branch=$(jq -er '.head_branch' <<<"$PR")" >> "$GITHUB_OUTPUT"
          echo "packages=$(jq -c '[.releases[].package_name]' <<<"$PR")" >> "$GITHUB_OUTPUT"

  # release-plz writes only each version's heading (release-plz.toml); the
  # change files of the packages it releases fill it. `cargo xtask close`
  # compiles the workspace, so it runs here with no token, no secret and no
  # environment, and hands its change on as a patch.
  changelogs:
    needs: release-pr
    if: needs.release-pr.outputs.branch != ''
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      head: ${{ steps.close.outputs.head }}
      changed: ${{ steps.close.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-pr.outputs.branch }}
          persist-credentials: false

      - uses: ./.github/actions/setup-rust

      - name: Join the change files
        id: close
        env:
          PACKAGES: ${{ needs.release-pr.outputs.packages }}
        run: |
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          args=()
          while read -r package; do
            args+=(--package "$package")
          done < <(jq -r '.[]' <<<"$PACKAGES")
          cargo xtask close --date "$(date -u +%F)" "${args[@]}"
          git add -A -- crates
          git diff --cached --binary > "$RUNNER_TEMP/changelogs.patch"
          if [ -s "$RUNNER_TEMP/changelogs.patch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.close.outputs.changed == 'true'
        with:
          name: changelogs
          path: ${{ runner.temp }}/changelogs.patch
          if-no-files-found: error
          retention-days: 1

  # Applies the patch on a fresh checkout, which runs no workspace code and
  # no hook, and pushes it. The commit is the app's bot user's, so
  # release-plz's next update force-pushes over it as over its own commit,
  # and `changelogs` joins the files again. A branch that moved since
  # `changelogs` read it is left alone: the run that moved it joins them.
  push-changelogs:
    needs: [release-pr, changelogs]
    if: needs.changelogs.outputs.changed == 'true'
    # The app's key is a release secret.
    environment: release
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.changelogs.outputs.head }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: changelogs
          path: ${{ runner.temp }}

      - name: Token for the release branch
        id: token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ secrets.ENSHWICK_CI_CLIENT_ID }}
          private-key: ${{ secrets.ENSHWICK_CI_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Commit and push
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          APP: ${{ steps.token.outputs.app-slug }}
          BRANCH: ${{ needs.release-pr.outputs.branch }}
          HEAD: ${{ needs.changelogs.outputs.head }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ "$(gh api "repos/$REPOSITORY/git/ref/heads/$BRANCH" --jq .object.sha)" != "$HEAD" ]; then
            echo "::notice title=changelogs::$BRANCH moved since its change files were joined; the run that moved it joins them"
            exit 0
          fi
          git apply --index "$RUNNER_TEMP/changelogs.patch"
          id=$(gh api "users/${APP}%5Bbot%5D" --jq .id)
          git -c user.name="${APP}[bot]" \
            -c user.email="${id}+${APP}[bot]@users.noreply.github.com" \
            commit -m "chore(release): join the change files into the changelogs"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git" \
            "HEAD:refs/heads/${BRANCH}"
