# Release pull requests and releases with release-plz (release-plz.toml), run
# by hand on main only. `release-pr` opens or updates the release pull
# request; `release`, after that pull request merged, tags each
# released crate `<package>-v<version>`, makes its GitHub release and
# publishes the public crates to crates.io through trusted publishing, which
# matches this file's name.
name: release-plz

on:
  workflow_dispatch:
    inputs:
      command:
        description: What to run
        type: choice
        options:
          - release-pr
          - release
        default: release-pr

permissions: {}

jobs:
  release-plz:
    # Releases come only from main.
    if: github.ref == 'refs/heads/main'
    # A fresh machine: what ships is built and published without the
    # caches that branch builds write to.
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      # crates.io trusted publishing.
      id-token: write
    concurrency:
      group: release-plz
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-rust

      # The app pushes the release branch and tags and opens the release pull
      # request, which then runs CI as any other; the job token may not open
      # pull requests.
      - name: Token for the release
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.ENSHWICK_CI_CLIENT_ID }}
          private-key: ${{ secrets.ENSHWICK_CI_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - uses: release-plz/action@f67a7e724bdad4a0f6875f186060a0ca2770d76c # v0.5.147
        with:
          command: ${{ inputs.command }}
        env:
          GITHUB_TOKEN: ${{ steps.token.outputs.token }}
