# Release pull requests and releases with release-plz (release-plz.toml), run
# by hand only. `release-pr` opens or updates the release pull request and
# starts ci.yml on it; `release`, after that pull request merged, tags each
# released crate `<package>-v<version>`, makes its GitHub release and
# publishes the public crates to crates.io through trusted publishing, which
# matches this file's name.
name: release-plz

on:
  workflow_dispatch:
    inputs:
      command:
        description: What to run
        type: choice
        options:
          - release-pr
          - release
        default: release-pr

permissions: {}

jobs:
  release-plz:
    # A fresh machine: what ships is built and published without the
    # caches that branch builds write to.
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      # Push the release branch and tags, make releases.
      contents: write
      pull-requests: write
      # Start ci.yml on the release branch.
      actions: write
      # crates.io trusted publishing.
      id-token: write
    concurrency:
      group: release-plz
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-rust
        with:
          gh: true

      - id: release-plz
        uses: release-plz/action@f67a7e724bdad4a0f6875f186060a0ca2770d76c # v0.5.147
        with:
          command: ${{ inputs.command }}
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # A pull request opened with GITHUB_TOKEN starts no workflow, but a
      # dispatch does, and the checks attach to the branch's commit.
      - name: Start CI on the release branch
        if: inputs.command == 'release-pr' && steps.release-plz.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.release-plz.outputs.pr }}
        run: |
          branch=$(jq -r .head_branch <<< "$PR")
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref "$branch"
