# Release pull requests and releases with release-plz (release-plz.toml), on
# main only. `release-pr` opens or updates the release pull request;
# `release`, after that pull request merged, tags each released crate
# `<package>-v<version>`, makes its GitHub release and publishes the public
# crates to crates.io through trusted publishing, which matches this file's
# name. A push to main runs both, but only while the repository variable
# RELEASE_ON_MERGE is `true`; until the first real release it is unset and
# releases run by hand.
name: release-plz

on:
  push:
    branches: [main]
    paths:
      - crates/**
      - Cargo.toml
      - Cargo.lock
      - release-plz.toml
  workflow_dispatch:
    inputs:
      command:
        description: What to run
        type: choice
        options:
          - release-pr
          - release
        default: release-pr

permissions: {}

jobs:
  release:
    # Releases come only from main; a push releases only once switched on.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' || vars.RELEASE_ON_MERGE == 'true') &&
      inputs.command != 'release-pr'
    # The release environment admits main only.
    environment: release
    # A fresh machine: what ships is built and published without the
    # caches that branch builds write to.
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      # crates.io trusted publishing.
      id-token: write
    # One group per commit: in a shared group a later merge would cancel the
    # pending run of a merged release pull request, and `release` acts only
    # on that commit.
    concurrency:
      group: release-plz-release-${{ github.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-rust

      # The app pushes the tags and makes the releases; the job token may not.
      - name: Token for the release
        id: token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ secrets.ENSHWICK_CI_CLIENT_ID }}
          private-key: ${{ secrets.ENSHWICK_CI_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - uses: release-plz/action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b # v0.5.148
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ steps.token.outputs.token }}

  release-pr:
    # After `release`, the order the action keeps when given no command;
    # skipped when `release` failed.
    needs: release
    if: >-
      !cancelled() && needs.release.result != 'failure' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' || vars.RELEASE_ON_MERGE == 'true') &&
      inputs.command != 'release'
    environment: release
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    # A newer run may replace a pending one: it covers the same commits.
    concurrency:
      group: release-plz-pr
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup-rust

      # The app pushes the release branch and opens the release pull request,
      # which then runs CI as any other; the job token may not open pull
      # requests.
      - name: Token for the release pull request
        id: token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ secrets.ENSHWICK_CI_CLIENT_ID }}
          private-key: ${{ secrets.ENSHWICK_CI_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - uses: release-plz/action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b # v0.5.148
        id: release-plz
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ steps.token.outputs.token }}

      # release-plz writes only each version's heading (release-plz.toml);
      # the change files of the packages it releases fill it. The commit is
      # the app's bot user's, so release-plz's next update force-pushes over
      # it as over its own commit, and this step joins the files again.
      - name: Join the change files into the release pull request
        env:
          PR: ${{ steps.release-plz.outputs.pr }}
          GH_TOKEN: ${{ steps.token.outputs.token }}
          APP: ${{ steps.token.outputs.app-slug }}
          REPOSITORY: ${{ github.repository }}
        run: |
          branch=$(jq -r '.head_branch // empty' <<<"${PR:-null}")
          args=()
          while read -r package; do
            args+=(--package "$package")
          done < <(jq -r '.releases[]?.package_name' <<<"${PR:-null}")
          # Without `--package`, close would take every package.
          if [[ -z "$branch" || ${#args[@]} -eq 0 ]]; then
            echo "no release pull request with packages"
            exit 0
          fi
          git fetch --no-tags origin "$branch"
          git switch --detach FETCH_HEAD
          cargo xtask close --date "$(date -u +%F)" "${args[@]}"
          git add -A -- crates
          if git diff --cached --quiet; then
            exit 0
          fi
          id=$(gh api "users/${APP}%5Bbot%5D" --jq .id)
          git -c user.name="${APP}[bot]" \
            -c user.email="${id}+${APP}[bot]@users.noreply.github.com" \
            commit -m "chore(release): join the change files into the changelogs"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git" \
            "HEAD:refs/heads/${branch}"
