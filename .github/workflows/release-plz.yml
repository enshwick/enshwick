# Release pull requests and releases with release-plz (release-plz.toml), run
# by hand only. `release-pr` opens or updates the release pull request and
# starts ci.yml on it; `release`, after that pull request merged, tags each
# released crate `<package>-v<version>`, makes its GitHub release and
# publishes the public crates to crates.io through trusted publishing, which
# matches this file's name.
name: release-plz

on:
  workflow_dispatch:
    inputs:
      command:
        description: What to run
        type: choice
        options:
          - release-pr
          - release
        default: release-pr

permissions: {}

jobs:
  release-plz:
    permissions:
      contents: write
      pull-requests: write
      actions: write
      id-token: write
    # From main: the runners take only enshwick/.github's workflows on main.
    uses: enshwick/.github/.github/workflows/release-plz.yml@main # zizmor: ignore[unpinned-uses]
    with:
      command: ${{ inputs.command }}
    # After a release, the enshwick-ci app starts Renovate for the mods.
    secrets:
      ENSHWICK_CI_CLIENT_ID: ${{ secrets.ENSHWICK_CI_CLIENT_ID }}
      ENSHWICK_CI_PRIVATE_KEY: ${{ secrets.ENSHWICK_CI_PRIVATE_KEY }}
