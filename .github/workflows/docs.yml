# Starts the docs site's build when what the site reads from this repository
# changes on main: the book, the changelog, the API's version and id rules,
# the compatibility reports and the error codes.
name: docs

on:
  push:
    branches: [main]
    paths:
      - "book/**"
      - "crates/enshwick/CHANGELOG.md"
      - "crates/enshwick/Cargo.toml"
      - "crates/enshwick/src/lib.rs"
      - "crates/internal/abi/src/abi.rs"
      - "crates/enshwick-gamedata/reports/**"
      - "crates/internal/loader/src/errors.toml"
      - .github/workflows/docs.yml

permissions: {}

concurrency:
  group: docs
  cancel-in-progress: true

jobs:
  site:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    steps:
      # The site builds on Cloudflare Workers Builds; its deploy hook builds
      # main once more, and a call while a build is still queued joins it.
      - name: Start the site build
        env:
          DOCS_DEPLOY_HOOK: ${{ secrets.DOCS_DEPLOY_HOOK }}
        run: curl --fail-with-body --silent --show-error --retry 3 -X POST "$DOCS_DEPLOY_HOOK"
