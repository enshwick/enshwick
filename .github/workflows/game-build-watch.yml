# Every 15 minutes: the public Steam builds of the
# dedicated server and the client, and an issue for each build that no table
# in crates/enshwick-gamedata/tables names. A new server build also gets its
# table ported by `cargo enshwick pin` in a pull request, with the compat
# report of the new table. Never on pull requests.
name: game-build-watch

on:
  schedule:
    # Every 15 minutes: GitHub delays scheduled runs by hours and drops
    # many, and a run that finds nothing new costs a few seconds on a
    # GitHub-hosted runner.
    - cron: "4,19,34,49 * * * *"
  workflow_dispatch:
    inputs:
      rehearse:
        description: Pin the current server build from itself, run the compat report and show the pull request in the summary; pushes nothing.
        type: boolean
        default: false

permissions: {}

concurrency:
  group: game-build-watch
  cancel-in-progress: false

jobs:
  watch:
    permissions:
      contents: read
      issues: write
    # main: the organization runners run only workflows from main.
    uses: enshwick/.github/.github/workflows/game-build-watch.yml@main # zizmor: ignore[unpinned-uses]
    with:
      pin: true
      rehearse: ${{ inputs.rehearse || false }}
    secrets:
      ENSHWICK_CI_CLIENT_ID: ${{ secrets.ENSHWICK_CI_CLIENT_ID }}
      ENSHWICK_CI_PRIVATE_KEY: ${{ secrets.ENSHWICK_CI_PRIVATE_KEY }}
