name: Install gh
description: >-
  The GitHub CLI at a pinned release, checked against its digest, for steps
  that publish releases.

runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TAG: v2.104.0
        GH_SHA256: 98cb101ad87dbbd3f6b2f2bfcbd43197ccd07643140121d8a9cfaa91eadbc24e
      run: | # zizmor: ignore[github-env] fixed paths only
        # The pin names the release tag, which Renovate looks releases up by.
        GH_VERSION="${GH_TAG#v}"
        dir="$RUNNER_TEMP/gh"
        archive="$RUNNER_TEMP/gh.tar.gz"
        curl --proto '=https' --tlsv1.2 -sSfL --retry 6 --retry-all-errors -o "$archive" \
          "https://github.com/cli/cli/releases/download/v$GH_VERSION/gh_${GH_VERSION}_linux_amd64.tar.gz"
        echo "$GH_SHA256  $archive" | sha256sum -c -
        mkdir -p "$dir"
        tar -xzf "$archive" -C "$dir" --strip-components 1
        echo "$dir/bin" >> "$GITHUB_PATH"
        "$dir/bin/gh" --version
