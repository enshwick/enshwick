name: Release files
description: >-
  Builds the release archive reproducibly with `cargo xtask dist`, each DLL
  carrying its dependency tree and, for a release, its signature, and puts
  the PDB and a CycloneDX SBOM of every DLL beside it. Needs setup-rust with
  cargo-cyclonedx and cargo-auditable.

inputs:
  out:
    description: The directory the archive, PDBs and SBOMs go to.
    required: true
  signing-key:
    description: >-
      The release key's secret, 64 hex digits; the archive then holds each
      DLL's signature, which the loader checks at start.
    required: false
    default: ""
  signed:
    description: >-
      "true" fails the build without a signing key, as a release must.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - uses: ./.github/actions/reproducible

    - name: cargo xtask dist
      shell: bash
      env:
        OUT: ${{ inputs.out }}
        # Each DLL carries its dependency tree, for `cargo audit bin`.
        ENSHWICK_AUDITABLE: "1"
        ENSHWICK_SIGNING_KEY: ${{ inputs.signing-key }}
        SIGNED: ${{ inputs.signed }}
      run: |
        if [ "$SIGNED" = true ]; then
          cargo xtask dist --out "$OUT" --signed
        else
          cargo xtask dist --out "$OUT"
        fi

    # A CycloneDX SBOM and the PDB of every DLL this build made.
    - name: SBOMs and PDBs
      shell: bash
      env:
        OUT: ${{ inputs.out }}
      run: |
        cargo cyclonedx --format json --target x86_64-pc-windows-msvc --no-build-deps
        cargo metadata --no-deps --format-version 1 | jq -r '
          .packages[] | . as $p | .targets[] | select(.kind | index("cdylib"))
          | [($p.manifest_path | sub("/Cargo.toml$"; "")), $p.name, (.name | gsub("-"; "_"))] | @tsv' |
          while IFS=$'\t' read -r dir package lib; do
            pdb="target/x86_64-pc-windows-msvc/release/$lib.pdb"
            [ -f "$pdb" ] || continue
            cp "$dir/$package.cdx.json" "$OUT/"
            [ -f "$OUT/$package.pdb" ] || cp "$pdb" "$OUT/$package.pdb"
          done
