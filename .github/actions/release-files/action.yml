name: Release files
description: >-
  Builds a repository's release archives reproducibly with `cargo xtask dist`
  or `cargo xtask bundle`, each DLL carrying its dependency tree, and puts the
  PDB and a CycloneDX SBOM of every DLL beside them. Needs setup-rust with
  cargo-cyclonedx and cargo-auditable.

inputs:
  task:
    description: The xtask that writes the archives, dist or bundle.
    default: dist
  out:
    description: The directory the archives, PDBs and SBOMs go to.
    required: true
  token:
    description: A token for gh, which the task uses to download release assets, such as the mods the platform bundle carries.
    required: true

runs:
  using: composite
  steps:
    # Reproducible builds: no machine paths in the DLLs and PDBs, no
    # timestamps from the linker, and the PDB named without its path.
    - name: Reproducible build flags
      shell: bash
      run: | # zizmor: ignore[github-env] fixed paths only
        {
          echo "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS=--remap-path-prefix=$GITHUB_WORKSPACE=/build --remap-path-prefix=$CARGO_HOME=/cargo --remap-path-prefix=$RUSTUP_HOME=/rustup -C link-arg=/Brepro -C link-arg=/PDBALTPATH:%_PDB%"
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)"
        } >> "$GITHUB_ENV"

    - name: cargo xtask ${{ inputs.task }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        TASK: ${{ inputs.task }}
        OUT: ${{ inputs.out }}
        # Each DLL carries its dependency tree, for `cargo audit bin`.
        ENSHWICK_AUDITABLE: "1"
      run: |
        case "$TASK" in
          dist | bundle) ;;
          *) echo "::error::task must be dist or bundle, not $TASK"; exit 1 ;;
        esac
        cargo xtask "$TASK" --out "$OUT"

    # A CycloneDX SBOM and the PDB of every DLL this build made.
    - name: SBOMs and PDBs
      shell: bash
      env:
        OUT: ${{ inputs.out }}
      run: |
        cargo cyclonedx --format json --target x86_64-pc-windows-msvc --no-build-deps
        cargo metadata --no-deps --format-version 1 | jq -r '
          .packages[] | . as $p | .targets[] | select(.kind | index("cdylib"))
          | [($p.manifest_path | sub("/Cargo.toml$"; "")), $p.name, (.name | gsub("-"; "_"))] | @tsv' |
          while IFS=$'\t' read -r dir package lib; do
            pdb="target/x86_64-pc-windows-msvc/release/$lib.pdb"
            [ -f "$pdb" ] || continue
            cp "$dir/$package.cdx.json" "$OUT/"
            [ -f "$OUT/$package.pdb" ] || cp "$pdb" "$OUT/$package.pdb"
          done
