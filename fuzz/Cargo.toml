# The fuzz targets, a workspace of their own: cargo-fuzz builds them with the
# nightly compiler and sanitizer flags, which the main workspace never sees.
# `cargo +nightly fuzz run <target>` runs one.
[package]
name = "enshwick-fuzz"
version = "0.0.0"
description = "libFuzzer targets for the inputs Enshwick reads from players, files and game images"
edition = "2024"
license = "MIT"
repository = "https://github.com/enshwick/enshwick"
publish = false

[lib]
name = "enshwick_fuzz"
path = "src/lib.rs"

[package.metadata]
cargo-fuzz = true

[dependencies]
cargo-enshwick = { path = "../crates/cargo-enshwick" }
enshwick = { path = "../crates/enshwick", features = ["unstable"] }
enshwick-gamedata = { path = "../crates/enshwick-gamedata" }
enshwick-loader = { path = "../crates/internal/loader" }
libfuzzer-sys = { version = "0.4.13", default-features = false, features = ["link_libfuzzer"] }
syn = { version = "3.0.9", default-features = false, features = ["full", "parsing"] }
toml = { version = "1.1.8", default-features = false, features = ["std", "parse", "display", "serde"] }
toml_edit = { version = "0.25.17", default-features = false, features = ["parse", "display"] }

[[bin]]
name = "action_sheet"
path = "fuzz_targets/action_sheet.rs"
test = false
doc = false
bench = false

[[bin]]
name = "join_lists"
path = "fuzz_targets/join_lists.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pattern"
path = "fuzz_targets/pattern.rs"
test = false
doc = false
bench = false

[[bin]]
name = "reflection"
path = "fuzz_targets/reflection.rs"
test = false
doc = false
bench = false

[[bin]]
name = "remote_edit"
path = "fuzz_targets/remote_edit.rs"
test = false
doc = false
bench = false

[[bin]]
name = "remote_message"
path = "fuzz_targets/remote_message.rs"
test = false
doc = false
bench = false

[[bin]]
name = "settings_files"
path = "fuzz_targets/settings_files.rs"
test = false
doc = false
bench = false

[[bin]]
name = "table"
path = "fuzz_targets/table.rs"
test = false
