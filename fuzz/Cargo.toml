bench = false

[[bin]]
name = "server_rules"
path = "fuzz_targets/server_rules.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mod_manifests"
path = "fuzz_targets/mod_manifests.rs"
test = false
doc = false
bench = false

[[bin]]
name = "wire_frames"
path = "fuzz_targets/wire_frames.rs"
test = false
doc = false
bench = false

[[bin]]
name = "archive"
path = "fuzz_targets/archive.rs"
test = false
