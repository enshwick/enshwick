version = "0.2.1"
description = "Tools for test servers: /admin commands and a command file run as the server console"
keywords = ["enshrouded", "mod", "server", "testing", "commands"]
categories = ["game-development"]
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
