[package]
name = "enshwick-updater"
version = "0.5.1"
description = "Updates Enshwick and the installed mods from their releases, with the player's consent"
keywords = ["enshrouded", "mod", "updater"]
categories = ["game-development"]
readme = "README.md"
authors.workspace = true
homepage = "https://github.com/themaiby/enshwick/tree/main/mods/enshwick-updater"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
enshwick-loader-api.workspace = true
minisign-verify.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }
zip.workspace = true

[lints]
workspace = true

[dev-dependencies]
toml.workspace = true
