# The updater's texts: its dialogs and the labels of its settings on the
# Mods screen. `{name}` stands for a value the updater fills in.

[en]
title = "Enshwick updater"
"available.list" = "Updates for Enshwick are available:"
"available.ask" = "Download them now? An update signed by its author is checked against the key of the version you have; an unsigned one comes over HTTPS from the source the mod names. They take effect the next time you start the game. Your settings stay as they are."
"next-start" = "They take effect the next time you start the game."
"table.fetched" = "Enshwick downloaded what it needs for this version of the game."
"table.restart" = "Restart the game to use every mod again."
"server.runs" = "This server runs mods you do not have in its version."
"server.updates" = "Updates of mods you have, each from the mod's own source:"
"server.new" = "Mods you do not have yet:"
"server.trust" = "The server names where each comes from and, for a signed one, its author key; a signed mod is installed only if its download is signed by that key. You trust these mods because you trust this server."
"server.ask" = "Download them? Restart the game afterwards and join again. Your settings stay as they are."
"server.next" = "Restart the game and join the server again."
"server.line" = "{name} {version}\n    from {source}\n    {signed}"
"server.key" = "author key {keys}"
"server.unsigned" = "unsigned, over HTTPS"
unavailable = "Not available for download:"
downloaded = "Downloaded:"
deleted = "{file} deleted: {name} replaces it"
"not-installed" = "Not installed:"
"see-log" = "The log is logs/enshwick/mods/updater.log."
line = "{name}: {from} → {to}"
"line.unsigned" = "{name}: {from} → {to} (unsigned)"
"line.older" = "{name}: {from} → {to} (older)"
"line.older-unsigned" = "{name}: {from} → {to} (older, unsigned)"
"line.missing" = "not installed"
"refusal.other-key" = "it is signed by another key than the installed version names (possible tampering, or the author changed keys); update it by hand if you trust it"
"refusal.not-server-key" = "it is not signed by the author key the server names"
"pick.ask" = "Download {line}? It takes effect the next time you start the game."
"pick.staged" = "Downloaded: takes effect at the next start"
"pick.unsigned" = "Unsigned: comes over HTTPS from the mod's own source"
"why.refused" = "refused: {why}"
"why.no-release" = "{repository} has no release {version} of {component} to download"
"why.no-signature" = "the release has no signature"
"why.not-listed" = "{url} lists no {version} to download"
"why.no-source" = "no release source"
"why.rate-limited" = "GitHub's limit for requests without an account is used up; try again in {minutes} min"
"config.enabled" = "Look for updates"
"config.enabled.doc" = "Off: the updater never goes online."
"config.check_interval_hours" = "Hours between checks"
"config.check_interval_hours.doc" = "0 checks at every start."
"config.trusted_keys" = "Trusted keys"
"config.trusted_keys.doc" = "Minisign keys accepted besides those each mod names. Add only keys of authors you trust."
"config.prereleases" = "Offer prereleases"
"config.prereleases.doc" = "Test versions too, before their release."

