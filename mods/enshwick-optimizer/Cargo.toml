[package]
name = "enshwick-optimizer"
version = "0.0.0-dev"
description = "Less server CPU on Windows and under Wine or Proton: exact short waits, task workers within a container's CPU limit, measurements and an environment report"
keywords = ["enshrouded", "mod", "wine", "proton", "performance"]
categories = ["game-development"]
readme = "README.md"
authors.workspace = true
homepage = "https://github.com/themaiby/enshwick/tree/main/mods/enshwick-optimizer"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
enshwick-loader-api.workspace = true
serde.workspace = true
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

[dev-dependencies]
enshwick-loader-api = { workspace = true, features = ["test"] }
toml.workspace = true

[package.metadata.enshwick]
# Builds only for Windows: off Windows, `cargo xtask check` lints it through
# cargo xwin and skips its tests.
windows-only = true

[lints]
workspace = true
