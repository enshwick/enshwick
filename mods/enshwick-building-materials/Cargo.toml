[package]
name = "enshwick-building-materials"
version = "0.0.0-dev"
description = "Building blocks, roofs, overgrowth, decor and furniture: twice the output of the vanilla recipes for the same cost"
keywords = ["enshrouded", "mod", "building", "recipes"]
categories = ["game-development"]
readme = "README.md"
authors.workspace = true
homepage = "https://github.com/enshwick/enshwick/tree/main/mods/enshwick-building-materials"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
enshwick.workspace = true
serde.workspace = true
toml.workspace = true

[dev-dependencies]
enshwick = { workspace = true, features = ["test"] }

[lints]
workspace = true
