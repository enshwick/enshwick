[package]
name = "enshwick-proton-optimizer"
version = "0.1.0"
description = "Exact short waits in the engine's event loop under Wine and Proton, with an environment report and CPU measurements"
keywords = ["enshrouded", "mod", "wine", "proton", "performance"]
categories = ["game-development"]
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
enshwick-api.workspace = true
serde.workspace = true
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

[dev-dependencies]
enshwick-test.workspace = true
toml.workspace = true

[lints]
workspace = true
