[package]
name = "enshwick-area-loot"
version = "0.0.0-dev"
description = "Empty one enemy corpse and the loot of the others around it comes along"
keywords = ["enshrouded", "mod", "loot"]
categories = ["game-development"]
readme = "README.md"
authors.workspace = true
homepage = "https://github.com/enshwick/enshwick/tree/main/mods/enshwick-area-loot"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
enshwick.workspace = true
serde.workspace = true

[lints]
workspace = true

[dev-dependencies]
enshwick = { workspace = true, features = ["test"] }
toml.workspace = true
