[en]
"safe.name" = "Safe"
"safe.description" = "A chest only its owner and the players they allow can open; only the owner can pick it up."
"safe.label" = "Safe · {owner}"
"command.help" = "allow <player>, deny <player> or list who may open your nearest Safe within 4 m"
"command.usage" = "/safe allow <player>, /safe deny <player>, /safe list: who may open your nearest Safe within 4 m."
"command.no_safe" = "No Safe of yours within 4 m."
"command.no_player" = "No player named {name} is online."
"command.several" = "Several players online are named {name}."
"command.self" = "You may always open your own Safe."
"command.allowed" = "{name} may now open your Safe at {at}, your nearest within 4 m."
"command.already" = "{name} may already open your Safe at {at}."
"command.denied" = "{name} may no longer open your Safe at {at}."
"command.not_allowed" = "{name} is not allowed at your Safe at {at}."
"command.list" = "Allowed at your Safe at {at}: {names}."
"command.list_empty" = "Only you may open your Safe at {at}."

