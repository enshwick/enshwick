[en]
"safe.name" = "Safe"
"safe.description" = "A chest only its owner and the players they allow can open; only the owner can pick it up."
"safe.label" = "Safe · {owner}"
"command.help" = "allow <player>, deny <player> or list who may open the nearest Safe you manage within 4 m"
"command.usage" = "/safe allow <player>, /safe deny <player>, /safe list: who may open the nearest Safe you manage within 4 m."
"command.no_safe" = "No Safe you manage within 4 m."
"command.no_player" = "No player named {name} is online."
"command.several" = "Several players online are named {name}."
"command.self" = "You may always open your own Safe."
"command.owner" = "{name} owns the Safe at {at}."
"command.yours" = "your Safe"
"command.theirs" = "{owner}'s Safe"
"command.unknown" = "another player's Safe"
"command.allowed" = "{name} may now open {safe} at {at}, the nearest you manage within 4 m."
"command.already" = "{name} may already open {safe} at {at}."
"command.denied" = "{name} may no longer open {safe} at {at}."
"command.not_allowed" = "{name} is not allowed at {safe} at {at}."
"command.list" = "Allowed at {safe} at {at}: {names}."
"command.list_empty" = "Nobody else is allowed at {safe} at {at}."
"command.refused" = "You may not change who opens your Safe at {at}."

