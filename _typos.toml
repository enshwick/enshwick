[files]
# Fuzz seeds are input bytes, not text.
extend-exclude = ["CHANGELOG.md", "*.lock", "*.exports", "texts.toml", "fuzz/corpus/",
  # The game's own names, spelled as its reflection spells them.
  "crates/enshwick/src/typed.rs", "crates/enshwick/src/typed/*.rs",
  "!crates/enshwick/src/typed/runtime.rs",
  "crates/enshwick-gamedata/src/typed/ids.rs", "crates/enshwick-gamedata/typed/",
  # Texts in other languages than English; the English ones are checked.
  "crates/internal/loader/src/texts/*.toml", "!crates/internal/loader/src/texts/en.toml"]

[default.extend-words]
# Engine and game names.
Keen = "Keen"
# Unreal Engine, as in UE4SS.
UE = "UE"
# Structured exception handling on Windows.
SEH = "SEH"
# The game's localisation tags, LocaTag.
Loca = "Loca"
# clang-cl's object file option, /Fo.
Fo = "Fo"
# A misspelling in a debug string of the game that a route loads.
Droped = "Droped"
# The game's spelling of its attack and behaviour types, AttackDesscription.
Desscription = "Desscription"
# The game's spelling of its impact number formats, ImpcatValueNumberFormat.
Impcat = "Impcat"

[default]
# Byte patterns of game code: hex bytes and `??`, such as "48 8B BA".
extend-ignore-re = ["\"([0-9A-Fa-f?]{1,2} )+[0-9A-Fa-f?]{1,2}\""]
