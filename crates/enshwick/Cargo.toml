[package]
name = "enshwick"
version = "1.0.0-alpha.7"
description = "The Enshwick Loader's modding API for Enshrouded: the one crate mods are written against"
keywords = ["enshrouded", "modding", "game", "ffi", "hooks"]
categories = ["game-development", "api-bindings"]
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = true

[dependencies]
enshwick-macros = { path = "../enshwick-macros", version = "=1.0.0-alpha.7" }
bcdec_rs.workspace = true
bytemuck.workspace = true
const-sha1.workspace = true
const_format.workspace = true
zune-core.workspace = true
zune-png.workspace = true
fastrand.workspace = true
memchr.workspace = true
postcard.workspace = true
rustc-hash.workspace = true
schemars = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
serde.workspace = true
strsim.workspace = true
thiserror.workspace = true
toml.workspace = true

[dev-dependencies]
proptest.workspace = true
criterion.workspace = true
insta.workspace = true
libloading = "=0.9.0"
syn = { version = "=3.0.9", default-features = false, features = ["full", "parsing"] }
serde = { workspace = true, features = ["derive"] }

[features]
# `enshwick::test`: a fake loader for a mod's unit tests.
test = []
# `packs::schemas`: the JSON Schemas of a data pack's files, for tools.
schema = ["dep:schemars", "dep:serde_json"]

[[test]]
name = "pack_schemas"
required-features = ["schema"]

