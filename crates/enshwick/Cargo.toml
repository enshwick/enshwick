[package]
name = "enshwick"
version = "1.0.0-alpha.14"
description = "The modding framework and API for Enshrouded: typed Rust, Luau and data packs, with a fake host for tests; the one crate a Rust mod depends on"
keywords = ["enshrouded", "modding", "game", "ffi", "hooks"]
categories = ["game-development", "api-bindings"]
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = true
autotests = false

[dependencies]
enshwick-macros = { path = "../enshwick-macros", version = "=1.0.0-alpha.14" }
enshwick-abi.workspace = true
enshwick-base.workspace = true
enshwick-core.workspace = true
enshwick-fake = { workspace = true, optional = true }
enshwick-values.workspace = true
document-features.workspace = true

[dev-dependencies]
proptest.workspace = true
criterion.workspace = true
insta.workspace = true
trybuild.workspace = true
serde = { workspace = true, features = ["derive"] }
toml.workspace = true
hound.workspace = true
postcard.workspace = true
rustc-hash.workspace = true
serde_json.workspace = true

[features]
## `test`: a fake loader for a mod's unit tests.
test = ["dep:enshwick-fake"]
## `packs::schemas`: the JSON Schemas of a data pack's files, for tools.
schema = ["enshwick-core/schema"]
## `unstable`: the parts of the API that may still change in any release:
## young APIs and calls that rest on engine facts not yet checked in the
## running game. Every item it adds is marked in the docs.
unstable = ["enshwick-core/unstable", "enshwick-fake?/unstable"]
## `typed`: every component, event and resource the game reflects as typed
## items generated from its reflection, a few thousand of them; it builds on
## `unstable`.
typed = ["unstable", "enshwick-core/typed", "enshwick-fake?/typed"]

# One binary for every file in `tests/`, each a module of `tests/main.rs`:
# one link instead of one per file. nextest still runs each test in a
# process of its own.
[[test]]
name = "main"
required-features = ["test"]

# Its mod, `you.lockers`, would share the binary with `point_schema`'s.
[[test]]
name = "call_schema"
required-features = ["test", "unstable"]

# Their binaries' sections hold a head of another format and a damaged one,
# which would turn off every mod of `main`.
[[test]]
name = "section_unread"
required-features = ["test"]

[[test]]
name = "section_damaged"
required-features = ["test"]

[lints]
workspace = true

# The mod this crate's documentation examples declare with `declare_mod!`.
[package.metadata.enshwick]
id = "you.hello"
side = "both"
exports = ["content:locker"]

[package.metadata.enshwick.requires]
lockers = { id = "you.lockers", version = ">=0.1, <1.0" }

[package.metadata.enshwick.after]
lanterns = "you.lanterns"
trading_post = "you.trading-post"

[[package.metadata.enshwick.builds]]
side = "server"
guid = "1c129660cd6efc4f9f0b21652d5ff2bf"
age = 387

[package.metadata.enshwick.builds.symbols]
"survivors.spawn_return" = 0x4_05cb

[package.metadata.docs.rs]
targets = ["x86_64-pc-windows-msvc"]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[bench]]
name = "hook_dispatch"
harness = false
required-features = ["test"]

[[bench]]
name = "world"
harness = false
required-features = ["test", "unstable"]

[[bench]]
name = "pattern_scan"
harness = false

[[bench]]
name = "channel_encode"
harness = false

[[bench]]
name = "chords"
harness = false
required-features = ["unstable"]

[[bench]]
name = "rates"
harness = false
required-features = ["unstable"]

[[bench]]
name = "tick"
harness = false
required-features = ["test"]

[[bench]]
name = "pack_logs"
harness = false
required-features = ["test"]

[[bench]]
name = "typed"
harness = false
required-features = ["test", "typed"]
