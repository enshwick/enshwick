[package]
name = "enshwick"
version = "1.0.0-alpha.11"
description = "The modding API of Enshwick for Enshrouded: typed Rust, Luau and data packs, with a fake host for tests; the one crate a Rust mod depends on"
keywords = ["enshrouded", "modding", "game", "ffi", "hooks"]
categories = ["game-development", "api-bindings"]
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = true
autotests = false

[dependencies]
enshwick-macros = { path = "../enshwick-macros", version = "=1.0.0-alpha.11" }
aho-corasick.workspace = true
bcdec_rs.workspace = true
bytemuck.workspace = true
const-sha1.workspace = true
const_format.workspace = true
document-features.workspace = true
zune-core.workspace = true
zune-png.workspace = true
fastrand.workspace = true
memchr.workspace = true
postcard.workspace = true
rustc-hash.workspace = true
schemars = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
serde.workspace = true
strsim.workspace = true
thiserror.workspace = true
toml.workspace = true

[dev-dependencies]
proptest.workspace = true
criterion.workspace = true
insta.workspace = true
syn = { version = "=3.0.9", default-features = false, features = ["full", "parsing"] }
serde = { workspace = true, features = ["derive"] }

[features]
## `test`: a fake loader for a mod's unit tests.
test = []
## `packs::schemas`: the JSON Schemas of a data pack's files, for tools.
schema = ["dep:schemars", "dep:serde_json"]
## `unstable`: the parts of the API that may still change in any release:
## young APIs and calls that rest on engine facts not yet checked in the
## running game. Every item it adds is marked in the docs.
unstable = []

# One binary for every file in `tests/`, each a module of `tests/main.rs`:
# one link instead of one per file. nextest still runs each test in a
# process of its own.
[[test]]
name = "main"
required-features = ["test"]

[lints]
workspace = true

# The mod this crate's documentation examples declare with `declare_mod!`.
[package.metadata.enshwick]
id = "you.hello"
side = "both"
join = true
exports = ["price", "price-of"]

[package.metadata.enshwick.requires]
lockers = { id = "you.lockers", version = ">=0.1, <1.0" }

[package.metadata.enshwick.recommends]
lanterns = "you.lanterns"
trading_post = "you.trading-post"

[[package.metadata.enshwick.builds]]
side = "server"
guid = "1c129660cd6efc4f9f0b21652d5ff2bf"
age = 387

[package.metadata.enshwick.builds.symbols]
"survivors.spawn_return" = 0x4_05cb

[package.metadata.docs.rs]
targets = ["x86_64-pc-windows-msvc"]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[bench]]
name = "hook_dispatch"
harness = false
required-features = ["test"]

[[bench]]
name = "world"
harness = false
required-features = ["test", "unstable"]

[[bench]]
name = "pattern_scan"
harness = false

[[bench]]
name = "channel_encode"
harness = false

[[bench]]
name = "rates"
harness = false
required-features = ["unstable"]

[[bench]]
name = "tick"
harness = false
required-features = ["test"]
