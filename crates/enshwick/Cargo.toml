[package]
name = "enshwick"
version = "1.0.0-alpha.8"
description = "The Enshwick Loader's modding API for Enshrouded: the one crate mods are written against"
keywords = ["enshrouded", "modding", "game", "ffi", "hooks"]
categories = ["game-development", "api-bindings"]
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = true
autotests = false

[dependencies]
enshwick-macros = { path = "../enshwick-macros", version = "=1.0.0-alpha.8" }
aho-corasick.workspace = true
bcdec_rs.workspace = true
bytemuck.workspace = true
const-sha1.workspace = true
const_format.workspace = true
document-features.workspace = true
zune-core.workspace = true
zune-png.workspace = true
fastrand.workspace = true
memchr.workspace = true
postcard.workspace = true
rustc-hash.workspace = true
schemars = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
serde.workspace = true
strsim.workspace = true
thiserror.workspace = true
toml.workspace = true

[dev-dependencies]
proptest.workspace = true
criterion.workspace = true
insta.workspace = true
libloading = "=0.9.0"
syn = { version = "=3.0.9", default-features = false, features = ["full", "parsing"] }
serde = { workspace = true, features = ["derive"] }

[features]
## `test`: a fake loader for a mod's unit tests.
test = []
## `packs::schemas`: the JSON Schemas of a data pack's files, for tools.
schema = ["dep:schemars", "dep:serde_json"]

# One binary for every file in `tests/`, each a module of `tests/main.rs`:
# one link instead of one per file. nextest still runs each test in a
# process of its own.
[[test]]
name = "main"
required-features = ["test"]

[lints]
workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-pc-windows-msvc"]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[[bench]]
name = "hook_dispatch"
harness = false
required-features = ["test"]

[[bench]]
name = "world"
harness = false
required-features = ["test"]

[[bench]]
name = "pattern_scan"
harness = false

[[bench]]
name = "rates"
harness = false

[[bench]]
name = "tick"
harness = false
required-features = ["test"]
