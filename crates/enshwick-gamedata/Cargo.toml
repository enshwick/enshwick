[package]
name = "enshwick-gamedata"
version = "1.0.0-alpha.14"
description = "Internal, not for mods: the anchors and engine routes the Enshwick loader finds its entries by on every game build, and the reader of the engine's reflection data"
keywords = ["enshrouded", "modding", "address-library", "reflection"]
categories = ["game-development"]
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = true

[features]
## Test-only API: an empty `Reflection` through `Default`.
test = []

[dependencies]
enshwick.workspace = true
iced-x86.workspace = true
memchr.workspace = true
ruzstd.workspace = true
rustc-hash.workspace = true
semver.workspace = true
serde.workspace = true
thiserror.workspace = true
toml.workspace = true
twox-hash.workspace = true
serde_json.workspace = true

[dev-dependencies]
enshwick = { workspace = true, features = ["test", "typed", "unstable"] }
proptest.workspace = true
criterion.workspace = true
insta.workspace = true

[lints]
workspace = true

[[bench]]
name = "archive_decode"
harness = false

[[bench]]
name = "reflection_scan"
harness = false

[[bench]]
name = "fall_back"
harness = false

[[bench]]
name = "routes"
harness = false

[[bench]]
name = "typed_cross"
harness = false
required-features = ["test"]
