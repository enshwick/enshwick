# Engine offsets, sizes and values by symbolic id. A `pattern` holds
# the code that uses the value, found once on a build without its own
# table; the value is read there from the `size` bytes at `at` (negated
# with `neg`, as `1 << n` with `shl`, plus `plus`), or, without `at`, kept
# as long as that code is found. `cargo enshwick pin --patterns` writes
# them around the instructions a maintainer picks with `--from`.
