# The patterns the loader carries to every game build, after the engine
# routes (`routes.toml`): per side, a row for each entry no route finds,
# for each symbol whose route does not check its code, and for the
# symbols a kept constant reads through. A row is a table row without
# an address: its pattern finds the entry on any build where it matches
# once and its witness, if any, agrees.

