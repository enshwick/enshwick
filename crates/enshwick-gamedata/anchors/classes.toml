# How each build table entry is anchored to the game. `engine`: the loader
# finds it in the game without a table row. `research`: no engine route is
# known yet. `pattern`: research found no engine route, so it stays a
# pattern. `entries` are ids, or prefixes ending in `*`; an id takes the row
# that names it, else the longest prefix.

[[class]]
entries = [
  "ecs.template_guid",
  "knowledge.push",
  "skill.node_unlocked",
  "skill.fly_mode_gate_return",
  "skill.airborne_architect_cell",
  "skill.airborne_architect",
  "inventory.view_fill",
  "inventory.view_frame",
  "ui.slider",
  "ui.hud",
  "ui.main_entry",
]
class = "engine"
reason = "an engine route finds it"

[[class]]
entries = [
  "inventory.view_fill.bytes",
  "ui.slider.bytes",
  "ui.hud.bytes",
  "ui.main_entry.bytes",
]
class = "engine"
reason = "the engine route of its symbol checks the code"

[[class]]
entries = [
  "attribute.experience_needed_slot",
