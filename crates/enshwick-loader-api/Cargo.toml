[package]
name = "enshwick-loader-api"
version = "0.5.0"
description = "The Enshwick Loader's modding API for Enshrouded: the one crate mods are written against"
keywords = ["enshrouded", "modding", "game", "ffi", "hooks"]
categories = ["game-development", "api-bindings"]
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
enshwick-loader-macros = { path = "../internal/macros", version = "0.5.0" }
bcdec_rs.workspace = true
zune-core.workspace = true
zune-png.workspace = true
postcard.workspace = true
serde.workspace = true
thiserror.workspace = true
toml.workspace = true

[dev-dependencies]
serde = { workspace = true, features = ["derive"] }

[features]
# `enshwick_loader_api::test`: a fake loader for a mod's unit tests.
test = []

