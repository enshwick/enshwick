[package]
name = "enshwick-loader-api"
version = "0.3.1"
description = "The Enshwick Loader's modding API for Enshrouded: the one crate mods are written against"
keywords = ["enshrouded", "modding", "game", "ffi", "hooks"]
categories = ["game-development", "api-bindings"]
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
enshwick-loader-macros = { path = "../internal/macros", version = "0.3.1" }
serde.workspace = true
thiserror.workspace = true
toml.workspace = true

[dev-dependencies]
serde = { workspace = true, features = ["derive"] }

[features]
# `enshwick_loader_api::test`: a fake loader for a mod's unit tests.
test = []

[[test]]
name = "game_events"
required-features = ["test"]

[[test]]
name = "inventory"
required-features = ["test"]

[[test]]
name = "lifecycle"
required-features = ["test"]

[[test]]
name = "mid_hook"
required-features = ["test"]

[[test]]
name = "no_inventories"
required-features = ["test"]

[[test]]
name = "players"
required-features = ["test"]

[[test]]
name = "stats"
required-features = ["test"]

[[test]]
name = "symbols"
required-features = ["test"]

[[test]]
name = "world_queries"
required-features = ["test"]

[[test]]
name = "worlds"
required-features = ["test"]

[lints]
workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-pc-windows-msvc"]
