[package]
name = "enshwick-loader"
version = "0.1.3"
description = "The Enshwick loader: finds the game build, loads mods and links their hooks inside Enshrouded"
keywords = ["enshrouded", "modding", "loader", "hooks"]
categories = ["game-development"]
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "enshwick"
crate-type = ["cdylib", "rlib"]
# The loader is no library for users.
doc = false

[dependencies]
arc-swap.workspace = true
enshwick-api.workspace = true
enshwick-reflect.workspace = true
rustc-hash.workspace = true
semver.workspace = true
serde.workspace = true
toml.workspace = true

[target.'cfg(windows)'.dependencies]
minhook.workspace = true
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
