[package]
name = "enshwick-loader"
version = "0.1.0"
description = "The Enshwick loader: finds the game build, loads mods and links their hooks inside Enshrouded"
keywords = ["enshrouded", "modding", "loader", "hooks"]
categories = ["game-development"]
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "enshwick"
crate-type = ["cdylib", "rlib"]

[dependencies]
api = { package = "enshwick", path = "../enshwick", version = "0.1.0" }
keen-reflect = { path = "../keen-reflect", version = "0.1.0" }
rustc-hash.workspace = true
semver.workspace = true

[target.'cfg(windows)'.dependencies]
minhook.workspace = true
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }

[lints]
workspace = true
