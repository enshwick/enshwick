[package]
name = "enshwick-api"
version = "0.1.4"
description = "Modding API for Enshrouded: the ABI and the safe layer mods are written against"
keywords = ["enshrouded", "modding", "game", "ffi", "hooks"]
categories = ["game-development", "api-bindings"]
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
enshwick-macros = { path = "../enshwick-macros", version = "0.1.1" }
serde.workspace = true
thiserror.workspace = true
toml.workspace = true

[dev-dependencies]
serde = { workspace = true, features = ["derive"] }
# The key differs from the package name: release-please reads dev-dependencies
# by key and refuses the cycle enshwick-test -> enshwick-api -> enshwick-test.
enshwick_test = { package = "enshwick-test", path = "../enshwick-test" }

[lints]
workspace = true

[package.metadata.docs.rs]
targets = ["x86_64-pc-windows-msvc"]
