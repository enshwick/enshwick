[package]
name = "enshwick-typed"
version = "1.0.0-alpha.15"
description = "Internal part of enshwick; depend on enshwick: the game's reflected types as generated Rust items"
keywords = ["enshrouded", "modding", "game"]
categories = ["game-development"]
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = true

[dependencies]
enshwick-values.workspace = true
thiserror.workspace = true

[dev-dependencies]
# The examples name the API as a mod does, through the facade, so they build
# as one binary; cargo drops a dev-dependency without a version when it
# publishes. They read the generated types, which the facade has with `typed`.
enshwick = { path = "../../enshwick", features = ["test", "typed"] }

[features]
# The compiled conversions the tests hold every generated type's shape to.
test = []

[lints]
workspace = true
