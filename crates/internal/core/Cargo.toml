[package]
name = "enshwick-core"
version = "1.0.0-alpha.14"
description = "Internal part of enshwick; depend on enshwick: Load, the top layer over the domains"
keywords = ["enshrouded", "modding", "game", "ffi", "hooks"]
categories = ["game-development", "api-bindings"]
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = true

[dependencies]
enshwick-macros = { path = "../macros", version = "=1.0.0-alpha.14" }
enshwick-abi.workspace = true
enshwick-base.workspace = true
enshwick-content.workspace = true
enshwick-world.workspace = true
enshwick-inventory.workspace = true
enshwick-knowledge.workspace = true
enshwick-actions.workspace = true
enshwick-ui.workspace = true
enshwick-packs.workspace = true
enshwick-values.workspace = true
serde.workspace = true
toml.workspace = true

[dev-dependencies]
# The examples name the API as a mod does, through the facade, so they build
# as one binary; cargo drops a dev-dependency without a version when it
# publishes. `unstable` and `typed` come from the command line, so the
# stable API's own build stays without them.
enshwick = { path = "../../enshwick", features = ["test"] }
serde = { workspace = true, features = ["derive"] }

# The features of `enshwick`, which turns each of them on here, and `fake`:
# what the fake loader reads inside this crate and a mod life per install,
# which only `enshwick-fake` turns on.
[features]
fake = [
    "enshwick-base/fake",
    "enshwick-content/fake",
    "enshwick-world/fake",
    "enshwick-knowledge/fake",
    "enshwick-actions/fake",
    "enshwick-ui/fake",
]
schema = ["enshwick-packs/schema"]
unstable = [
    "enshwick-base/unstable",
    "enshwick-content/unstable",
    "enshwick-world/unstable",
    "enshwick-inventory/unstable",
    "enshwick-knowledge/unstable",
    "enshwick-actions/unstable",
    "enshwick-ui/unstable",
    "enshwick-packs/unstable",
]
typed = [
    "unstable",
    "enshwick-content/typed",
    "enshwick-world/typed",
    "enshwick-knowledge/typed",
    "enshwick-ui/typed",
]

[lints]
workspace = true

# The mod this crate's documentation examples declare with `declare_mod!`.
[package.metadata.enshwick]
id = "you.hello"
side = "both"
exports = ["content:locker"]

[package.metadata.enshwick.requires]
lockers = { id = "you.lockers", version = ">=0.1, <1.0" }

[package.metadata.enshwick.after]
lanterns = "you.lanterns"
trading_post = "you.trading-post"

[[package.metadata.enshwick.builds]]
side = "server"
guid = "1c129660cd6efc4f9f0b21652d5ff2bf"
age = 387

[package.metadata.enshwick.builds.symbols]
"survivors.spawn_return" = 0x4_05cb

[package.metadata.docs.rs]
targets = ["x86_64-pc-windows-msvc"]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
