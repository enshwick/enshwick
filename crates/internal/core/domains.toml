# The domains of the API, the crate of each, and which domain each module
# left in enshwick-core belongs to.
# A module names only its own domain and the domains before its own in
# `order`; shared things move down into base. `cargo xtask check` holds it.

# Lowest first, which is also the order domains leave core in.
order = ["base", "content", "world", "inventory", "knowledge", "actions", "ui", "packs"]

# Files and folders under `src` that join every domain's list: `Load` with
# its forwarders into the crates below, and the script binding's namespace
# lists, which open each domain's handles through `Load`.
joins = [
    "lib.rs",
    "declare.rs",
    "load.rs",
    "load/",
    "script/namespaces/",
    "__private.rs",
    "__fake.rs",
]

# The internal crates below every domain, which a domain's crate may name.
below = ["enshwick-abi", "enshwick-macros", "enshwick-typed", "enshwick-values"]

# The edges up the order still in the code, as `from -> to`; a peel removes
# its own. A new one fails, and so does one that is gone.
upward = []

# The crate each domain that left core lives in, by its folder under
# `crates/internal`. Its `[dependencies]` name of the internal crates only
# those of `below` and the crates of the domains before its own, and of
# those, as core's do, only the ones its code outside tests names: one named
# only under a `cfg(feature)` is optional and turned on by that feature.
# The order allows an edge; the code makes it, so the domains form a graph.
[crates]
base = "base"
content = "content"
world = "world"
inventory = "inventory"
knowledge = "knowledge"
actions = "actions"
ui = "ui"
packs = "packs"

# The top-level modules core keeps besides `Load`, by domain.
[modules]
# The script binding's namespace lists, over base's runtime.
base = ["script"]

# The fake loader, `crates/internal/fake/src/test`, cut by the same domains:
# each file under `test/` and `test/table/` belongs to the domain its folder
# or file is named after, and `test.rs` and `test/table.rs` join them. A
# domain's files name only its own domain and those before it, of the fake
# and of core.
[fake]
# The edges up the order still in the fake, as `from -> to`.
upward = []

# The loader, `crates/runtime/loader/src`, cut by the same domains above
# layers of its own: each file under `src/<layer>/` belongs to that layer,
# each under `src/host/entries/<domain>` to that domain, and the joins sit
# above them all. A layer's modules name only their own layer and the layers
# before it, and no join.
[loader]
# The layers below every domain, lowest first: the hooking engine, raw game
# access and the loader's own state.
below = ["engine"]
# The top-level modules that join every layer: the server step's pump, the
# host table, the layers' part lists and the start.
joins = ["events", "host", "parts", "start"]
# The folder under `src` whose files are cut by the domains as well.
entries = "host/entries"
# The edges up the layers still in the code, as `from -> to` between
# modules; a new one fails, and so does one that is gone.
upward = [
    "actions::controls -> ui::interface",
    "actions::player_actions -> ui::windows",
    "base::admission -> actions::chat",
    "base::game_events -> actions::vetoes",
    "base::game_events -> inventory::item_actions",
    "base::game_events -> inventory::stats",
    "base::greeting -> actions::chat",
    "base::join -> ui::interface",
    "base::lobby -> ui::interface",
    "base::net -> actions::chat",
    "base::net -> actions::controls",
    "base::net -> actions::player_actions",
    "base::net -> content::recipes",
    "base::net -> content::served",
    "base::net -> inventory::item_data",
    "base::net -> ui::interface",
    "base::remote -> actions::controls",
    "base::remote -> actions::player_actions",
    "base::remote -> content::recipes",
    "base::remote -> ui::interface",
    "base::remote -> ui::windows",
    "base::saves -> actions::console",
    "base::saves -> actions::player_actions",
    "base::status -> content::served",
    "base::status -> knowledge::store",
    "base::watch -> content::recipes",
    "base::worlds -> content::recipes",
    "content::rate_links -> inventory::loot_slot",
    "content::rate_links -> inventory::transactions",
    "content::served -> ui::interface",
    "engine::code -> content::recipes",
    "engine::code -> world::bases",
    "engine::loader -> base::advertise",
    "engine::loader -> base::manifest",
    "engine::loader -> base::points",
    "engine::loader -> base::releases",
    "engine::loader -> base::resolve",
    "engine::loader -> base::worlds",
    "engine::loader -> packs::data_packs",
    "engine::profile -> host",
    "engine::texts -> base::net",
    "engine::texts -> content::served",
    "entries::actions -> ui::windows",
    "entries::base -> content::content_renames",
    "entries::base -> content::served",
    "entries::content -> inventory::item_data",
    "entries::content -> inventory::transactions",
    "entries::world -> actions::chat",
    "entries::world -> actions::chat_mute",
    "entries::world -> actions::console",
    "entries::world -> inventory::transactions",
    "entries::world -> knowledge::progress",
    "inventory::item_actions -> actions::interactions",
    "world::entities -> inventory::spawns",
    "world::transactions -> actions::interactions",
    "world::transactions -> inventory::spawns",
    "world::transactions -> inventory::transactions",
]
