# The domains of enshwick-core and the modules of each. A module names
# only base, its own domain and the domains before its own in `order`;
# shared things move down into base. `cargo xtask check` holds it.

# Lowest first: each domain is peeled out of core in the reverse order.
order = ["base", "content", "world", "inventory", "knowledge", "actions", "ui", "packs"]

# Files and folders under `src` that join every domain's list.
joins = ["lib.rs", "__private.rs", "__private/", "__fake.rs", "__fake/", "script/namespaces"]

# The edges up the order still in the code, as `from -> to`; a peel removes
# its own. A new one fails, and so does one that is gone.
upward = [
    # The served-resource builder lives in content; it moves to resources
    # with the content peel.
    "resources -> content",
    # Rate kinds are declared in rates; the name rules move with them.
    "rules -> rates",
    # The typed handles read components through World.
    "typed -> world",
    # Content's journal and knowledge entries name knowledge ids and scopes.
    "content -> knowledge",
]

[modules]
base = [
    "code",
    "command_names",
    "config",
    "declare",
    "ecs",
    "engine_enum",
    "engine_ids",
    "events",
    "facts",
    "files",
    "fresh",
    "game_events",
    "hook",
    "host",
    "i18n",
    "load",
    "locks",
    "mods",
    "near",
    "net",
    "pacing",
    "points",
    "resources",
    "rules",
    "schedule",
    "schema_section",
    "script",
    "services",
    "state",
    "status",
    "time",
]
content = ["content", "rates", "typed"]
world = [
    "altars",
    "buffs",
    "daytime",
    "game_settings",
    "map",
    "terrain",
    "voxels",
    "weather",
    "world",
