# The domains of the API and the modules of each still in enshwick-core.
# A module names only its own domain and the domains before its own in
# `order`; shared things move down into base. `cargo xtask check` holds it.

# Lowest first, which is also the order domains leave core in.
order = ["base", "content", "world", "inventory", "knowledge", "actions", "ui", "packs"]

# Files and folders under `src` that join every domain's list: `Load` with
# its forwarders into the crates below, and the script binding, which opens
# each domain's handles through `Load`.
joins = [
    "lib.rs",
    "declare.rs",
    "load.rs",
    "load/",
    "script.rs",
    "script/",
    "__private.rs",
    "__fake.rs",
]

# The internal crates below every domain, which a domain's crate may name.
below = ["enshwick-abi", "enshwick-macros", "enshwick-values"]

# The edges up the order still in the code, as `from -> to`; a peel removes
# its own. A new one fails, and so does one that is gone.
upward = [
    # The typed handles read components through World.
    "typed -> world",
    # Content's journal and knowledge entries name knowledge ids and scopes.
    "content -> knowledge",
]

# The crate each domain that left core lives in, by its folder under
# `crates/internal`. Its `[dependencies]` name of the internal crates only
# those of `below` and the crates of the domains before its own.
[crates]
base = "base"

# Each domain's top-level modules still in core.
[modules]
base = []
content = ["content", "rates", "typed"]
world = [
    "altars",
    "buffs",
    "daytime",
    "game_settings",
    "map",
    "terrain",
    "voxels",
    "weather",
    "world",
    "world_error",
]
inventory = [
    "affixes",
    "damage",
    "effects",
    "entity_data",
    "inventory",
    "item_data",
    "items",
    "loot",
    "stats",
    "survivors",
]
knowledge = ["knowledge", "progress", "quests", "rewards"]
actions = ["actions", "chat", "commands", "console", "controls", "input", "interactions", "vetoes"]
ui = ["sound", "ui"]
packs = ["packs"]
