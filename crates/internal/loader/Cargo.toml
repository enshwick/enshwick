[package]
name = "enshwick-loader"
version = "1.0.0-alpha.4"
description = "Internal, not for mods: the Enshwick Loader DLL that finds the game build, loads mods and links their hooks inside Enshrouded"
keywords = ["enshrouded", "modding", "loader", "hooks"]
categories = ["game-development"]
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "enshwick_loader"
crate-type = ["cdylib", "rlib"]
# The loader is no library for users.
doc = false

[dependencies]
arc-swap.workspace = true
base64.workspace = true
enshwick.workspace = true
enshwick-gamedata.workspace = true
postcard.workspace = true
rustc-hash.workspace = true
semver.workspace = true
serde.workspace = true
sha2.workspace = true
strsim.workspace = true
thiserror.workspace = true
toml.workspace = true
toml_edit.workspace = true

[target.'cfg(windows)'.dependencies]
arrayvec.workspace = true
iced-x86.workspace = true
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

# Only for the model test of the hook chains: `RUSTFLAGS="--cfg loom"`.
[target.'cfg(loom)'.dependencies]
loom = { version = "0.7.2", default-features = false }

[dev-dependencies]
bytemuck.workspace = true
criterion.workspace = true
insta.workspace = true
proptest.workspace = true

[package.metadata.enshwick]
# Most of it runs only on Windows: off Windows, `cargo xtask check` runs its
# portable tests on the host and the rest under Wine with `--windows`.
windows-tests = true

[lints]
workspace = true

[[bench]]
name = "registry_read"
harness = false

[[bench]]
name = "item_kinds"
harness = false
