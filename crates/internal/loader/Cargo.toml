[package]
name = "enshwick-loader"
version = "0.8.1"
description = "Internal, not for mods: the Enshwick Loader DLL that finds the game build, loads mods and links their hooks inside Enshrouded"
keywords = ["enshrouded", "modding", "loader", "hooks"]
categories = ["game-development"]
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
name = "enshwick"
crate-type = ["cdylib", "rlib"]
# The loader is no library for users.
doc = false

[dependencies]
arc-swap.workspace = true
arrayvec.workspace = true
base64.workspace = true
enshwick-loader-api.workspace = true
enshwick-loader-builds.workspace = true
enshwick-loader-reflect.workspace = true
postcard.workspace = true
rustc-hash.workspace = true
semver.workspace = true
serde.workspace = true
sha2.workspace = true
toml.workspace = true
toml_edit.workspace = true
ruzstd.workspace = true

[target.'cfg(windows)'.dependencies]
iced-x86.workspace = true
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
