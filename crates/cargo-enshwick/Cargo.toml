[package]
name = "cargo-enshwick"
version = "0.6.0"
description = "Cargo subcommand for Enshwick mods: start a mod, build it, install it into the game and port build rows to a new game build"
keywords = ["enshrouded", "modding", "cargo", "cli"]
categories = ["development-tools::cargo-plugins", "game-development"]
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
clap = { workspace = true }
enshwick-loader-api = { workspace = true, features = ["schema"] }
enshwick-loader-reflect.workspace = true
iced-x86.workspace = true
memchr.workspace = true
serde.workspace = true
serde_json.workspace = true
toml_edit.workspace = true
semver.workspace = true
zip.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_LibraryLoader"] }

[lints]
workspace = true
