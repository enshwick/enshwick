[package]
name = "cargo-enshwick"
version = "1.0.0-alpha.14"
description = "Cargo subcommand for mods of Enshwick, the modding framework for Enshrouded: start a mod, build it, install it into the game and port build rows to a new game build"
keywords = ["enshrouded", "modding", "cargo", "cli"]
categories = ["development-tools::cargo-plugins", "game-development"]
readme = "README.md"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = true

# The binaries each release carries, which `cargo binstall` installs.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }{ binary-ext }"
pkg-fmt = "bin"

[dependencies]
anyhow.workspace = true
clap = { workspace = true }
enshwick-abi.workspace = true
enshwick-core = { workspace = true, features = ["schema", "typed"] }
enshwick-gamedata.workspace = true
iced-x86.workspace = true
memchr.workspace = true
rustc-hash.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
toml_edit.workspace = true
thiserror.workspace = true
semver.workspace = true
sha2.workspace = true
zip.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_System_Registry"] }

[dev-dependencies]
# The tests compile what the tool writes for mods, which name `enshwick`.
enshwick = { workspace = true, features = ["typed"] }
insta.workspace = true
proptest.workspace = true

[lints]
workspace = true
