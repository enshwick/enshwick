[package]
name = "xtask"
version = "0.0.0"
description = "Repository tasks: the checks a change needs, run as cargo xtask"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
default-run = "xtask"

# `cargo xtask compat`: what works on a game build. It links the loader, so
# it is a binary of its own, which plain `cargo xtask` builds and runs; a
# rebuild of the running `xtask.exe` would fail on Windows.
[[bin]]
name = "xtask-compat"
path = "src/compat.rs"
required-features = ["compat"]

[features]
compat = ["dep:anyhow", "cargo-enshwick/cli", "dep:clap", "dep:enshwick-abi", "dep:enshwick-gamedata", "dep:enshwick-loader", "dep:memchr", "dep:rustc-hash", "dep:toml_edit"]

[dependencies]
anyhow = { workspace = true, optional = true }
cargo-enshwick.workspace = true
cbindgen.workspace = true
clap = { workspace = true, optional = true }
enshwick-abi = { workspace = true, optional = true }
enshwick-gamedata = { workspace = true, optional = true }
memchr = { workspace = true, optional = true }
proc-macro2 = { version = "1.0.107", default-features = false, features = ["span-locations"] }
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
syn = { version = "3.0.9", default-features = false, features = ["full", "parsing", "visit"] }
rustc-hash = { workspace = true, optional = true }
toml.workspace = true
toml_edit = { workspace = true, optional = true }
zip.workspace = true

[target.'cfg(windows)'.dependencies]
enshwick-loader = { path = "../../crates/runtime/loader", optional = true }

[lints]
workspace = true
