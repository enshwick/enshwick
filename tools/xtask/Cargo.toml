[package]
name = "xtask"
version = "0.0.0"
description = "Repository tasks: the checks a change needs, run as cargo xtask"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# `cargo xtask compat`: what works on a game build. It links the loader, so
# plain `cargo xtask` builds without it and runs itself again with it.
compat = ["dep:clap", "dep:enshwick", "dep:enshwick-gamedata", "dep:enshwick-loader", "dep:memchr"]

[dependencies]
cbindgen.workspace = true
clap = { workspace = true, optional = true }
enshwick = { workspace = true, optional = true }
enshwick-gamedata = { workspace = true, optional = true }
memchr = { workspace = true, optional = true }
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
zip.workspace = true

[target.'cfg(windows)'.dependencies]
enshwick-loader = { path = "../../crates/internal/loader", optional = true }

[lints]
workspace = true
