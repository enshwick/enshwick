id: ids-are-constants
language: rust
severity: error
message: name a `mod-id:what` id through a constant, not a literal in code
note: >-
  A service, event, point, stat or content id spelled twice drifts; one
  `const` keeps every use the same and lets the compiler find them. The rule
  sees only literals shaped like `mod-id:what`; setting keys, channel and file
  names have no shape it can tell from other text, so review holds them.
ignores:
  - "**/tests/**"
  - "**/tests.rs"
  - "**/*_tests.rs"
  - "**/benches/**"
utils:
  in-test:
    any:
      - kind: mod_item
        follows:
          kind: attribute_item
          stopBy:
            not:
              any:
                - kind: attribute_item
                - kind: line_comment
          regex: '^#\[cfg\(.*\btest\b'
      - kind: function_item
        follows:
          kind: attribute_item
          stopBy:
            not:
              any:
                - kind: attribute_item
                - kind: line_comment
          regex: '^#\[(test|cfg\(.*\btest\b)'
rule:
  kind: string_literal
  regex: '^"[a-z][a-z0-9-]*(\.[a-z0-9-]+)?:[a-z0-9][a-z0-9_.-]*"$'
  not:
    inside:
      stopBy: end
      any:
        - kind: const_item
        - kind: static_item
        - matches: in-test
