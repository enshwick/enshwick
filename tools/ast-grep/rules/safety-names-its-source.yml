id: safety-names-its-source
language: rust
severity: error
message: a SAFETY comment names its invariant and where it comes from, not an earlier comment
note: >-
  Write out the invariant and its source again (an engine fact with its game
  build, a check above it by name, a type's guarantee), even when it repeats
  the comment before.
rule:
  kind: line_comment
  regex: '^//\s*SAFETY:.*(?i)\b(as above|see above|same as (above|before)|as before|ditto)\b'
