id: tests-listen-on-loopback
language: rust
severity: error
message: a test listens on 127.0.0.1 or [::1], never on every network
note: >-
  A test program that listens on 0.0.0.0 or [::] raises the Windows firewall
  prompt on a developer's desktop and opens a port to the network while the
  test runs. The rule reads test files for the strings 0.0.0.0 and [::],
  `UNSPECIFIED` and an all-zero `Ipv4Addr::new` or `Ipv6Addr::new` outside a
  macro; a test that only checks such a value carries an ignore comment.
  Not seen: "::", "::0" and "0:0:0:0:0:0:0:0", arrays such as
  `([0, 0, 0, 0], port)`, `Ipv4Addr::from(0u32)`, `from_bits(0)`, typed
  zeros such as `0u8`, calls inside a macro, an address from a fixture
  file and a default in non-test code; the test harness that opens a
  listener checks its address at run time instead.
files:
  - "**/tests/**"
  - "**/tests.rs"
  - "**/*_tests.rs"
utils:
  every-network:
    any:
      - kind: string_content
        regex: '\b0\.0\.0\.0\b|\[::\]'
      - kind: identifier
        regex: '^UNSPECIFIED$'
      - kind: call_expression
        regex: 'Ipv[46]Addr::new\(\s*0(\s*,\s*0){3,7}\s*,?\s*\)$'
rule:
  matches: every-network
---
id: test-modules-listen-on-loopback
language: rust
severity: error
message: a test listens on 127.0.0.1 or [::1], never on every network
note: >-
  As `tests-listen-on-loopback`, for test code in other files: a
  `#[cfg(test)]` module or function, or a `#[test]` function.
ignores:
  - "**/tests/**"
  - "**/tests.rs"
  - "**/*_tests.rs"
utils:
  every-network:
    any:
      - kind: string_content
        regex: '\b0\.0\.0\.0\b|\[::\]'
      - kind: identifier
        regex: '^UNSPECIFIED$'
      - kind: call_expression
        regex: 'Ipv[46]Addr::new\(\s*0(\s*,\s*0){3,7}\s*,?\s*\)$'
  in-test:
    any:
      - kind: mod_item
        follows:
          kind: attribute_item
          stopBy:
            not:
              any:
                - kind: attribute_item
                - kind: line_comment
          regex: '^#\[cfg\(.*\btest\b'
      - kind: function_item
        follows:
          kind: attribute_item
          stopBy:
            not:
              any:
                - kind: attribute_item
                - kind: line_comment
          regex: '^#\[(test|cfg\(.*\btest\b)'
rule:
  matches: every-network
  inside:
    stopBy: end
    matches: in-test
