id: lock-through-relock
valid:
  - "fn f(m: &Mutex<u8>) { let g = m.relock(); }"
  - "fn f(m: &RwLock<u8>) { let g = m.relock_read(); }"
  - "fn f() { let out = std::io::stdout().lock(); }"
  - "fn f(file: &mut File, buf: &mut [u8]) { let n = file.read(buf).unwrap_or(0); }"
  - |
    impl<T> Relock<T> for Mutex<T> {
        fn relock(&self) -> MutexGuard<'_, T> {
            self.lock().unwrap_or_else(PoisonError::into_inner)
        }
    }
  - |
    impl<T> Relock<T> for Mutex<T> {
        fn relock(&self) -> MutexGuard<'_, T> {
            let Ok(guard) = self.lock() else {
                return self.lock().unwrap_or_else(PoisonError::into_inner);
            };
            guard
        }
    }
  - "fn f() { let err = std::io::stderr().lock(); }"
  - "fn f(s: &Settings) { match s.read() { Some(v) => drop(v), other => drop(other) } }"
  - "fn f(s: &Settings) { let Some(v) = s.read() else { return }; drop(v); }"
  - "fn f(s: &Settings) { if let Some(v) = s.read() { drop(v); } }"
  - "fn f(c: &Condvar, g: MutexGuard<'_, u8>) { let g = c.relock_wait(g); }"
  - "fn f(child: &mut Child) -> io::Result<()> { child.wait()?; Ok(()) }"
  - "fn f(b: &Barrier) { let leader = b.wait().is_leader(); }"
  - |
    #[cfg(test)]
    mod tests {
        fn f(m: &Mutex<u8>) { let g = m.lock().unwrap(); }
    }
  - |
    #[test]
    fn locks() { let g = M.lock().unwrap(); }
invalid:
  - "fn f(m: &Mutex<u8>) { let g = m.lock().unwrap(); }"
  - "fn f(m: &Mutex<u8>) { let g = m.lock().ok(); }"
  - "fn f(m: &Mutex<u8>) { let g = m.lock().unwrap_or_else(PoisonError::into_inner); }"
  - "fn f(m: &RwLock<u8>) { let g = m.write().expect(\"poisoned\"); }"
  - "fn f(m: &Mutex<u8>) { if let Ok(g) = m.lock() { drop(g); } }"
  - "fn f(m: &Mutex<u8>) { match m.try_lock() { Ok(g) => drop(g), Err(_) => {} } }"
  - "fn f(m: &Mutex<u8>) -> Result<(), E> { let g = m.lock()?; Ok(()) }"
  - "fn f(m: &Mutex<u8>) { let Ok(g) = m.lock() else { return }; drop(g); }"
  - "fn f(m: &RwLock<u8>) { let Ok(g) = m.try_read() else { return }; drop(g); }"
  - "fn f(m: &Mutex<u8>) { let r = m.lock(); drop(r.unwrap()); }"
  - "fn f(m: &Mutex<u8>) { let mut r = m.lock(); drop(r.unwrap()); }"
  - "fn f(m: &Mutex<u8>) { match m.lock() { Err(_) => {}, Ok(g) => drop(g) } }"
  - "fn f(c: &Condvar, g: MutexGuard<'_, u8>) { let g = c.wait(g).unwrap(); }"
  - "fn f(c: &Condvar, g: MutexGuard<'_, bool>) { let g = c.wait_while(g, |s| !*s).unwrap_or_else(PoisonError::into_inner); }"
  - "fn f(c: &Condvar, g: MutexGuard<'_, u8>, d: Duration) { let (g, t) = c.wait_timeout(g, d).unwrap(); }"
  - "fn f(c: &Condvar, g: MutexGuard<'_, bool>, d: Duration) -> Result<(), E> { let (g, t) = c.wait_timeout_while(g, d, |s| !*s)?; Ok(()) }"
  - "fn f(c: &Condvar, g: MutexGuard<'_, u8>) { if let Ok(g) = c.wait(g) { drop(g); } }"
