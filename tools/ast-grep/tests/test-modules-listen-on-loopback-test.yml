            format!("rcon_ip = \"[::]\"\nrcon_port = {port}\n")
        }
    }
  - |
    #[test]
    fn a_client_reaches_the_console() {
        let socket = UdpSocket::bind((Ipv4Addr::UNSPECIFIED, 0));
    }
  - |
    #[cfg(test)]
    fn listener() -> UdpSocket {
        UdpSocket::bind((Ipv4Addr::new(0, 0, 0, 0), 0)).unwrap()
    }
