id: loader-flag-is-in-state
valid:
  - "static FUSE: Fuse = Fuse::new(\"lamp\");"
  - "static QUEUE: Pending<u32> = Pending::new();"
  - "static LAYOUT: OnceLock<Layout> = OnceLock::new();"
  - "static STATE: State = State { any: AtomicBool::new(false) };"
  - "struct State { any: AtomicBool }"
  - |
    #[cfg(test)]
    mod tests {
        static RAN: AtomicBool = AtomicBool::new(false);
    }
invalid:
  - "static WANTED: AtomicBool = AtomicBool::new(false);"
  - "static STEP: std::sync::atomic::AtomicU64 = std::sync::atomic::AtomicU64::new(0);"
  - "static JOINED: [AtomicU32; 8] = [const { AtomicU32::new(0) }; 8];"
