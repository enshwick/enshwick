coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

comment: false

github_checks:
  annotations: false

# Generated from the game's reflection, and test files; inline test modules
# still count, since stable Rust cannot mark them out.
ignore:
  - "**/tests/**"
  - "**/tests.rs"
  - crates/enshwick/src/typed.rs
  - crates/enshwick/src/typed/**
  - crates/enshwick/src/ui/screens.rs
  - crates/enshwick-gamedata/src/typed/ids.rs
  - examples/**
  - fuzz/**
  - tools/**
