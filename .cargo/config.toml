[alias]
# Repository tasks, such as the checks before a push: tools/xtask.
xtask = "run --quiet --package xtask --"

[target.x86_64-pc-windows-msvc]
# A static CRT needs no redistributable on players' machines; x86-64-v2 is
# what Windows 11 24H2 already requires.
rustflags = ["-C", "target-feature=+crt-static", "-C", "target-cpu=x86-64-v2"]
# The LLD that ships with the toolchain links native Windows builds as the
# release builds already link (cargo-xwin's lld-link wins over this setting),
# in under half the memory of link.exe and about a tenth less time on a rebuild.
linker = "rust-lld"
