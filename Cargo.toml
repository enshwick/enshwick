[workspace]
resolver = "3"
members = ["crates/*", "mods/*"]

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/themaiby/enshwick"
publish = false

[workspace.dependencies]
arc-swap = { version = "1.9.3", default-features = false }
clap = { version = "4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "env"] }
arrayvec = { version = "0.7.8", default-features = false, features = ["std"] }
enshwick-api = { path = "crates/enshwick-api", version = "0.1.0" }
enshwick-reflect = { path = "crates/enshwick-reflect", version = "0.1.0" }
enshwick-geometry = { path = "crates/enshwick-geometry", version = "0.1.0" }
enshwick-test = { path = "crates/enshwick-test", version = "0.1.0" }
iced-x86 = { version = "1.21.0", default-features = false, features = ["std", "decoder", "block_encoder", "instr_info"] }
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
rustc-hash = { version = "2.1.3", default-features = false, features = ["std"] }
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }
semver = { version = "1.0.28", default-features = false, features = ["std"] }
serde = { version = "1.0.229", default-features = false, features = ["std", "derive"] }
toml = { version = "1.1.8", default-features = false, features = ["std", "parse", "display", "serde"] }
windows-sys = { version = "0.61.2", default-features = false }
thiserror = { version = "2.0.21", default-features = false, features = ["std"] }

[workspace.lints.rust]
missing_docs = "deny"
missing_debug_implementations = "deny"
unreachable_pub = "deny"
unsafe_op_in_unsafe_fn = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
improper_ctypes = "deny"
improper_ctypes_definitions = "deny"
missing_abi = "deny"
non_ascii_idents = "deny"
let_underscore_drop = "deny"
unit_bindings = "deny"
redundant_lifetimes = "deny"
trivial_numeric_casts = "deny"
unused_qualifications = "deny"
unexpected_cfgs = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
missing_crate_level_docs = "deny"
invalid_codeblock_attributes = "deny"
invalid_html_tags = "deny"
invalid_rust_codeblocks = "deny"
bare_urls = "deny"
unescaped_backticks = "deny"
redundant_explicit_links = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
# cargo-deny owns duplicate versions.
multiple_crate_versions = "allow"
missing_errors_doc = "deny"
missing_panics_doc = "deny"
missing_safety_doc = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
unnecessary_safety_comment = "deny"
unnecessary_safety_doc = "deny"
fn_to_numeric_cast_any = "deny"
mem_forget = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
exit = "deny"
mod_module_files = "deny"
tests_outside_test_module = "deny"
clone_on_ref_ptr = "deny"
format_push_string = "deny"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# Unwinding stays on: every detour catches panics and falls back to vanilla.
panic = "unwind"
debug = "line-tables-only"
strip = "none"

[profile.profiling]
inherits = "release"
debug = "full"
