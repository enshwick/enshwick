[workspace]
resolver = "3"
members = [
    "crates/cargo-enshwick",
    "crates/enshwick",
    "crates/enshwick-gamedata",
    "crates/internal/*",
    "crates/runtime/*",
    "examples/chest-panel",
    "examples/haggling",
    "examples/horn",
    "examples/lucky",
    "examples/item-ui",
    "examples/trading-post",
    "examples/hello-c",
    "examples/waypoints",
    "tools/xtask",
]

[workspace.package]
authors = ["themaiby"]
edition = "2024"
rust-version = "1.100"
license = "MIT"
repository = "https://github.com/enshwick/enshwick"
homepage = "https://enshwick.com"
publish = false

[workspace.dependencies]
anyhow = { version = "1.0.104", default-features = false, features = ["std"] }
arc-swap = { version = "1.9.3", default-features = false }
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
const-sha1 = { version = "0.3.0", default-features = false }
const_format = { version = "0.2.37", default-features = false }
document-features = "0.2.12"
ed25519-dalek = { version = "3.0.0", default-features = false }
clap = { version = "4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "env"] }
aho-corasick = { version = "1.1.5", default-features = false, features = ["std", "perf-literal"] }
arrayvec = { version = "0.7.8", default-features = false, features = ["std"] }
crossbeam-queue = { version = "0.3.14", default-features = false, features = ["std"] }
cbindgen = { version = "0.29.4", default-features = false }
bytemuck = { version = "1.25.2", default-features = false, features = ["derive", "min_const_generics", "zeroable_atomics"] }
enshwick = { path = "crates/enshwick", version = "=1.0.0-alpha.17" }
enshwick-luau = { path = "crates/runtime/luau", version = "=1.0.0-alpha.17" }
enshwick-loader-start = { path = "crates/runtime/start", version = "=1.0.0-alpha.17" }
enshwick-abi = { path = "crates/internal/abi", version = "=1.0.0-alpha.17" }
enshwick-base = { path = "crates/internal/base", version = "=1.0.0-alpha.17" }
enshwick-content = { path = "crates/internal/content", version = "=1.0.0-alpha.17" }
enshwick-world = { path = "crates/internal/world", version = "=1.0.0-alpha.17" }
enshwick-inventory = { path = "crates/internal/inventory", version = "=1.0.0-alpha.17" }
enshwick-knowledge = { path = "crates/internal/knowledge", version = "=1.0.0-alpha.17" }
enshwick-actions = { path = "crates/internal/actions", version = "=1.0.0-alpha.17" }
enshwick-ui = { path = "crates/internal/ui", version = "=1.0.0-alpha.17" }
enshwick-packs = { path = "crates/internal/packs", version = "=1.0.0-alpha.17" }
enshwick-core = { path = "crates/internal/core", version = "=1.0.0-alpha.17" }
enshwick-fake = { path = "crates/internal/fake", version = "=1.0.0-alpha.17" }
enshwick-values = { path = "crates/internal/values", version = "=1.0.0-alpha.17" }
enshwick-typed = { path = "crates/internal/typed", version = "=1.0.0-alpha.17" }
enshwick-gamedata = { path = "crates/enshwick-gamedata", version = "=1.0.0-alpha.17" }
cargo-enshwick = { path = "crates/cargo-enshwick", version = "=1.0.0-alpha.17", default-features = false }
fastrand = { version = "2.5.0", default-features = false, features = ["std"] }
insta = { version = "1.49.0", default-features = false }
iced-x86 = { version = "1.21.0", default-features = false, features = ["std", "decoder", "block_encoder", "instr_info"] }
mlua = { version = "0.12.2", default-features = false, features = ["luau", "send"] }
memchr = { version = "2.8.3", default-features = false, features = ["std"] }
bcdec_rs = { version = "0.2.1", default-features = false }
zune-png = { version = "0.5.2", default-features = false, features = ["std"] }
hound = "3.5.1"
claxon = "0.4.3"
lewton = "0.10.2"
nanomp3 = { version = "0.2.0", default-features = false, features = ["std", "layer12"] }
rubato = "5.1.0"
zune-core = { version = "0.5.3", default-features = false, features = ["std"] }
postcard = { version = "1.1.3", default-features = false, features = ["alloc"] }
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
trybuild = "1.0.122"
schemars = { version = "1.2.3", default-features = false, features = ["std", "derive"] }
rustc-hash = { version = "2.1.3", default-features = false, features = ["std"] }
strsim = { version = "0.11.1", default-features = false }
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }
sha2 = { version = "0.11.1", default-features = false }
semver = { version = "1.0.28", default-features = false, features = ["std"] }
serde = { version = "1.0.229", default-features = false, features = ["std", "derive"] }
toml_edit = { version = "0.25.17", default-features = false, features = ["parse", "display"] }
toml = { version = "1.1.8", default-features = false, features = ["std", "parse", "display", "serde"] }
zip = { version = "9.1.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
windows-sys = { version = "0.61.2", default-features = false }
twox-hash = { version = "2.1.5", default-features = false, features = ["std", "xxhash3_128"] }
ruzstd = { version = "0.9.1", default-features = false, features = ["std"] }
thiserror = { version = "2.0.21", default-features = false, features = ["std"] }

[workspace.lints.rust]
missing_docs = "deny"
missing_debug_implementations = "deny"
unreachable_pub = "deny"
unsafe_op_in_unsafe_fn = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
improper_ctypes = "deny"
improper_ctypes_definitions = "deny"
missing_abi = "deny"
non_ascii_idents = "deny"
let_underscore_drop = "deny"
unit_bindings = "deny"
redundant_lifetimes = "deny"
trivial_numeric_casts = "deny"
unused_qualifications = "deny"
unexpected_cfgs = { level = "deny", check-cfg = ["cfg(enshwick_asan)", "cfg(enshwick_docs)", "cfg(kani)", "cfg(loom)"] }

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
missing_crate_level_docs = "deny"
invalid_codeblock_attributes = "deny"
invalid_html_tags = "deny"
invalid_rust_codeblocks = "deny"
bare_urls = "deny"
unescaped_backticks = "deny"
redundant_explicit_links = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
# cargo-deny owns duplicate versions.
multiple_crate_versions = "allow"
# Its fix, `assert_eq!(value, [] as [T; 0])`, reads worse than `is_empty()`,
# and the test name already says what was expected.
assert_is_empty = "allow"
too_long_first_doc_paragraph = "deny"
doc_link_code = "warn"
doc_paragraphs_missing_punctuation = "warn"
missing_errors_doc = "deny"
missing_panics_doc = "deny"
missing_safety_doc = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
unnecessary_safety_comment = "deny"
unnecessary_safety_doc = "deny"
fn_to_numeric_cast_any = "deny"
mem_forget = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
exit = "deny"
mod_module_files = "deny"
tests_outside_test_module = "deny"
clone_on_ref_ptr = "deny"
format_push_string = "deny"

# Line tables keep file and line in panics and backtraces; full debug info
# only grows the target directory and slows linking.
[profile.dev]
debug = "line-tables-only"

# Dependencies build optimised: the tests that read the game's executables
# spend their time in decoders and the disassembler, and the pin tests took
# 40 to 70 s each at opt-level 0, 3 s at 2 (2026-11-24). Only a cold build
# pays for it; the workspace's own crates stay at 0 and rebuild as fast.
[profile.dev.package."*"]
debug = false
opt-level = 2

# Fat LTO reaches only targets whose every crate type can take it: the
# loader's library is a cdylib and an rlib, so its DLL ships without
# cross-crate LTO, while the stub DLL, a cdylib alone, gets it. One
# codegen unit stays: 16 for the generated types alone made a loader hot path
# 7% slower (2026-11-24).
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# Unwinding stays on: every detour catches panics and falls back to vanilla.
panic = "unwind"
debug = "line-tables-only"
strip = "none"

# Benches build as the loader DLL ships, without cross-crate LTO, so their
# numbers are the shipped code's; a fat-LTO link per bench took about 190 s of
# a 340 s build (2026-11-24). Once the DLL ships with fat LTO, this goes back.
# Build one bench at a time with `cargo xtask bench <name>`, which compares
# with main's kept executable instead of building main again.
[profile.bench]
lto = false

[profile.profiling]
inherits = "release"
debug = "full"
