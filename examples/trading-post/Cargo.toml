[package]
name = "enshwick-example-trading-post"
version = "0.0.0-dev"
description = "Example: a mod that publishes a typed service and sends a mod event"
keywords = ["enshrouded", "mod", "example"]
categories = ["game-development"]
readme = "../README.md"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata.enshwick]
id = "you.trading-post"
side = "server"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
enshwick = { workspace = true, features = ["unstable"] }

[dev-dependencies]
enshwick = { workspace = true, features = ["test"] }

[lints]
workspace = true
