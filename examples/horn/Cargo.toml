[package]
name = "enshwick-example-horn"
version = "0.0.0-dev"
description = "Example: a mod whose control on G honks through the server, and a control that follows the game's interact key"
keywords = ["enshrouded", "mod", "example"]
categories = ["game-development"]
readme = "../README.md"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata.enshwick]
id = "you.horn"
side = "both"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
enshwick = { workspace = true, features = ["unstable"] }

[dev-dependencies]
enshwick = { workspace = true, features = ["test", "unstable"] }

[lints]
workspace = true
