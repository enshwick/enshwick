[package]
name = "enshwick-example-waypoints"
version = "0.0.0-dev"
description = "Example: a mod whose server half sends a player's position and whose client half draws it"
keywords = ["enshrouded", "mod", "example"]
categories = ["game-development"]
readme = "../README.md"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata.enshwick]
id = "you.waypoints"
side = "both"
name = "Waypoints"
join = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
arc-swap.workspace = true
enshwick = { workspace = true, features = ["unstable"] }
serde.workspace = true

[dev-dependencies]
enshwick = { workspace = true, features = ["test"] }

[lints]
workspace = true
