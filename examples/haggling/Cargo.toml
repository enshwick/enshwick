[package]
name = "enshwick-example-haggling"
version = "0.0.0-dev"
description = "Example: a mod that changes the trading post's prices at its extension point"
keywords = ["enshrouded", "mod", "example"]
categories = ["game-development"]
readme = "../README.md"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata.enshwick]
id = "you.haggling"
side = "server"

[package.metadata.enshwick.recommends]
trading_post = "you.trading-post"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
arc-swap.workspace = true
enshwick.workspace = true
serde.workspace = true

[dev-dependencies]
enshwick = { workspace = true, features = ["test"] }

[lints]
workspace = true
