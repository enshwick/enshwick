[package]
name = "enshwick-example-market-stalls"
version = "0.0.0-dev"
description = "Example: a mod that uses another mod's typed service and subscribes to its event"
keywords = ["enshrouded", "mod", "example"]
categories = ["game-development"]
readme = "../README.md"
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[package.metadata.enshwick]
id = "you.market-stalls"
side = "server"

[package.metadata.enshwick.requires]
trading_post = { id = "you.trading-post", version = ">=0.1, <1.0" }

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
enshwick-example-trading-post-api = { path = "../trading-post-api", version = "0.0.0-dev" }
enshwick.workspace = true

[dev-dependencies]
enshwick = { workspace = true, features = ["test"] }

[lints]
workspace = true
